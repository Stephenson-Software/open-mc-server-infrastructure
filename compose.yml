services:
  minecraft-wrapper:
    build:
      context: .
      args:
        - MINECRAFT_VERSION=${MINECRAFT_VERSION}
    image: open-mc-server
    restart: always
    container_name: ${CONTAINER_NAME:-open-mc-server}
    stop_grace_period: 45s
    ports:
      - "${HOST_PORT:-25565}:25565"
      - "${HOST_RCON_PORT:-25575}:25575"
      - "${HOST_BLUEMAP_PORT:-8100}:8100"
      - "${WRAPPER_PORT:-8092}:8092"
    volumes:
      - mcserver:/mcserver
      - ./deposit-box:/deposit-box
    depends_on:
      alert-manager:
        condition: service_healthy
    healthcheck:
      # start_period allows for Spigot's first-boot BuildTools compilation (mirrors the
      # 10-minute startupProbe budget in helm/omcsi/templates/minecraft-wrapper.yaml).
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8092/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 600s
    environment:
      - MINECRAFT_VERSION=${MINECRAFT_VERSION}
      - OPERATOR_UUID=${OPERATOR_UUID}
      - OPERATOR_NAME=${OPERATOR_NAME}
      - OPERATOR_LEVEL=${OPERATOR_LEVEL}
      - OVERWRITE_EXISTING_SERVER=${OVERWRITE_EXISTING_SERVER}
      - MINECRAFT_AUTO_START=${MINECRAFT_AUTO_START:-true}
      - MINECRAFT_AUTO_RESTART=${MINECRAFT_AUTO_RESTART:-false}
      - SERVER_MOTD=${SERVER_MOTD}
      - MAX_PLAYERS=${MAX_PLAYERS}
      - DIFFICULTY=${DIFFICULTY}
      - GAMEMODE=${GAMEMODE}
      - PVP_ENABLED=${PVP_ENABLED}
      - ONLINE_MODE=${ONLINE_MODE}
      - JAVA_OPTS=${JAVA_OPTS}
      - RCON_PASSWORD=${RCON_PASSWORD:-minecraft}
      # Alert configuration
      - ALERT_MANAGER_URL=${ALERT_MANAGER_URL:-http://alert-manager:8090/api/alerts}
      - ALERTS_SERVER_START=${ALERTS_SERVER_START:-true}
      - ALERTS_SERVER_STOP=${ALERTS_SERVER_STOP:-true}
      - ALERTS_SERVER_CRASH=${ALERTS_SERVER_CRASH:-true}
      - ALERTS_CONFIG_WARNING=${ALERTS_CONFIG_WARNING:-false}
      - ALERTS_PLUGIN_DEPLOY=${ALERTS_PLUGIN_DEPLOY:-true}
      - ALERTS_WORLD_UPLOAD=${ALERTS_WORLD_UPLOAD:-true}
      # Diagnostic log access (consumed by ServerController's GET /api/server/logs).
      # Must be enabled here *and* via DIAGNOSTICS_LOGS_ENABLED on agent-manager
      # for the agent to include log snippets in diagnostics.
      - LOGS_DIAGNOSTIC_ENABLED=${LOGS_DIAGNOSTIC_ENABLED:-false}
      - LOGS_DIAGNOSTIC_MAX_LINES=${LOGS_DIAGNOSTIC_MAX_LINES:-100}
      # Plugin deployment CI/CD configuration
      - DEPLOY_AUTH_TOKEN=${DEPLOY_AUTH_TOKEN:-}
      - PLUGINS_DIRECTORY=${PLUGINS_DIRECTORY:-/mcserver/plugins}
      - DEFAULT_PLUGINS=${DEFAULT_PLUGINS:-}
      # World directory. Must match the webapp's WORLD_DIRECTORY below: the webapp
      # lists/deletes worlds under this path while the wrapper installs uploaded
      # worlds there, so a mismatch silently hides uploads from the dashboard.
      - WORLD_DIRECTORY=${WORLD_DIRECTORY:-/mcserver/world}
      # World upload limits. A request meets NGINX_MAX_BODY_SIZE, then these
      # multipart limits, then the WORLD_UPLOAD_* checks — raise them together
      # or the smallest silently caps the rest.
      - MAX_FILE_UPLOAD_SIZE=${MAX_FILE_UPLOAD_SIZE:-2048MB}
      - MAX_REQUEST_UPLOAD_SIZE=${MAX_REQUEST_UPLOAD_SIZE:-2048MB}
      - MULTIPART_TEMP_DIR=${MULTIPART_TEMP_DIR:-}
      - WORLD_UPLOAD_MAX_FILE_SIZE_MB=${WORLD_UPLOAD_MAX_FILE_SIZE_MB:-2048}
      - WORLD_UPLOAD_MAX_EXTRACTED_MB=${WORLD_UPLOAD_MAX_EXTRACTED_MB:-10240}
      - WORLD_UPLOAD_MAX_ENTRIES=${WORLD_UPLOAD_MAX_ENTRIES:-100000}
      # Web app integration
      - WEBAPP_URL=${WEBAPP_URL:-http://webapp:8080}
      - DEPLOYMENT_AUTH_TOKEN=${DEPLOYMENT_AUTH_TOKEN:-}

  webapp:
    build:
      context: ./web-app
    image: open-mc-server-webapp
    restart: always
    container_name: ${WEB_CONTAINER_NAME:-open-mc-webapp}
    expose:
      - "8080"
    volumes:
      - webapp-data:/app/data
      # Mount mcserver volume for plugin management
      # Note: Docker named volumes don't support mounting subdirectories,
      # so we mount the entire volume but PluginService enforces access only to /mcserver/plugins
      - mcserver:/mcserver:rw
    depends_on:
      - minecraft-wrapper
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - MC_HOST=minecraft-wrapper
      - MC_RCON_PORT=25575
      - MC_RCON_PASSWORD=${RCON_PASSWORD:-minecraft}
      - MC_MOTD=${SERVER_MOTD}
      - MC_MAX_PLAYERS=${MAX_PLAYERS}
      - DYNMAP_URL=${DYNMAP_URL:-}
      - BLUEMAP_URL=${BLUEMAP_URL:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - WEB_REFRESH_INTERVAL_MS=${WEB_REFRESH_INTERVAL_MS:-1800000}
      - ACTIVITY_TRACKER_URL=${ACTIVITY_TRACKER_URL:-}
      - ACTIVITY_TRACKER_ENABLED=${ACTIVITY_TRACKER_ENABLED:-false}
      - DASHBOARD_TITLE=${DASHBOARD_TITLE:-Minecraft Server Dashboard}
      - DASHBOARD_SUBTITLE=${DASHBOARD_SUBTITLE:-Server Management & Information}
      - DASHBOARD_PRIMARY_COLOR=${DASHBOARD_PRIMARY_COLOR:-#667eea}
      - DASHBOARD_SECONDARY_COLOR=${DASHBOARD_SECONDARY_COLOR:-#764ba2}
      - DASHBOARD_DARK_MODE=${DASHBOARD_DARK_MODE:-true}
      - DATA_STORAGE_PATH=${DATA_STORAGE_PATH:-/app/data}
      # Full alerts endpoint. ALERT_MANAGER_URL is a single .env value shared with
      # minecraft-wrapper, backup-manager and agent-manager, so every consumer must
      # use the same form.
      - ALERT_MANAGER_URL=${ALERT_MANAGER_URL:-http://alert-manager:8090/api/alerts}
      - ALERT_MANAGER_ENABLED=${ALERT_MANAGER_ENABLED:-true}
      - MINECRAFT_WRAPPER_URL=${MINECRAFT_WRAPPER_URL:-http://minecraft-wrapper:8092}
      - MINECRAFT_WRAPPER_ENABLED=${MINECRAFT_WRAPPER_ENABLED:-true}
      - ACCORDION_CHAT_URL=${ACCORDION_CHAT_URL:-}
      - DEPLOYMENT_AUTH_TOKEN=${DEPLOYMENT_AUTH_TOKEN:-}
      # The webapp authenticates to the wrapper's POST /api/world/upload with this
      # token, so it needs the same secret the wrapper validates against.
      - DEPLOY_AUTH_TOKEN=${DEPLOY_AUTH_TOKEN:-}
      - WORLD_DIRECTORY=${WORLD_DIRECTORY:-/mcserver/world}
      # Spring multipart limits. nginx (NGINX_MAX_BODY_SIZE) is the effective cap.
      - MAX_FILE_UPLOAD_SIZE=${MAX_FILE_UPLOAD_SIZE:-2048MB}
      - MAX_REQUEST_UPLOAD_SIZE=${MAX_REQUEST_UPLOAD_SIZE:-2048MB}
      - MULTIPART_TEMP_DIR=${MULTIPART_TEMP_DIR:-}
      # Covers extraction, the world swap and the restart, not just transfer.
      - WORLD_UPLOAD_READ_TIMEOUT_SECONDS=${WORLD_UPLOAD_READ_TIMEOUT_SECONDS:-600}

  nginx:
    build:
      context: ./nginx
    image: open-mc-server-nginx
    restart: always
    container_name: ${NGINX_CONTAINER_NAME:-open-mc-nginx}
    ports:
      - "${WEB_HTTP_PORT:-8080}:80"
      - "${WEB_HTTPS_PORT:-8443}:443"
    environment:
      # Maximum request body size accepted by the proxy. This is the effective
      # upload cap for the dashboard — raise it alongside MAX_FILE_UPLOAD_SIZE.
      - NGINX_MAX_BODY_SIZE=${NGINX_MAX_BODY_SIZE:-100M}
      # Applied to the upload routes only; the rest of the dashboard keeps 60s.
      - NGINX_UPLOAD_TIMEOUT=${NGINX_UPLOAD_TIMEOUT:-3600s}
    depends_on:
      - webapp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - nginx-ssl:/etc/nginx/ssl

  backup-manager:
    build:
      context: ./backup-manager
    image: open-mc-server-backup-manager
    restart: always
    container_name: ${BACKUP_CONTAINER_NAME:-open-mc-backup-manager}
    ports:
      - "${BACKUP_PORT:-8091}:8091"
    volumes:
      - mcserver:/mcserver:ro
      - backups:/backups
    depends_on:
      alert-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - BACKUP_DIRECTORY=/backups
      - BACKUP_MAX_SIZE_MB=${BACKUP_MAX_SIZE_MB:-10240}
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 0 2 * * ?}
      # Alert configuration
      - ALERT_MANAGER_URL=${ALERT_MANAGER_URL:-http://alert-manager:8090/api/alerts}
      - ALERTS_BACKUP_SUCCESS=${ALERTS_BACKUP_SUCCESS:-true}
      - ALERTS_BACKUP_FAILURE=${ALERTS_BACKUP_FAILURE:-true}

  alert-manager:
    build:
      context: ./alert-manager
    image: open-mc-server-alert-manager
    restart: always
    container_name: ${ALERT_CONTAINER_NAME:-open-mc-alert-manager}
    ports:
      - "${ALERT_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - alert-manager-data:/app/data
    environment:
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - DISCORD_ENABLED=${DISCORD_ENABLED:-false}
      - MINECRAFT_RCON_HOST=${MINECRAFT_RCON_HOST:-minecraft-wrapper}
      - MINECRAFT_RCON_PORT=${MINECRAFT_RCON_PORT:-25575}
      - MINECRAFT_RCON_PASSWORD=${RCON_PASSWORD:-minecraft}
      - MINECRAFT_RCON_ENABLED=${MINECRAFT_RCON_ENABLED:-true}

  agent-manager:
    build:
      context: ./agent-manager
    image: open-mc-server-agent-manager
    restart: always
    container_name: ${AGENT_CONTAINER_NAME:-open-mc-agent-manager}
    ports:
      - "${AGENT_PORT:-8093}:8093"
    depends_on:
      alert-manager:
        condition: service_healthy
      minecraft-wrapper:
        condition: service_started
      backup-manager:
        condition: service_started
    healthcheck:
      # Health is served on the Spring Boot management port (8094), not the API port
      # (8093) — see CLAUDE.md's service table.
      test: ["CMD", "curl", "-f", "http://localhost:8094/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - AGENT_DISCORD_BOT_TOKEN=${AGENT_DISCORD_BOT_TOKEN:-}
      - AGENT_DISCORD_CHANNEL_ID=${AGENT_DISCORD_CHANNEL_ID:-}
      - AGENT_ANTHROPIC_API_KEY=${AGENT_ANTHROPIC_API_KEY:-}
      - AGENT_ANTHROPIC_MODEL=${AGENT_ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      - AGENT_ANTHROPIC_MAX_TOKENS=${AGENT_ANTHROPIC_MAX_TOKENS:-1024}
      - AGENT_ENABLED=${AGENT_ENABLED:-false}
      - MINECRAFT_WRAPPER_URL=${MINECRAFT_WRAPPER_URL:-http://minecraft-wrapper:8092}
      - AGENT_START_SERVER_REQUIRES_CONFIRMATION=${AGENT_START_SERVER_REQUIRES_CONFIRMATION:-true}
      - AGENT_STOP_SERVER_REQUIRES_CONFIRMATION=${AGENT_STOP_SERVER_REQUIRES_CONFIRMATION:-true}
      - AGENT_RESTART_SERVER_REQUIRES_CONFIRMATION=${AGENT_RESTART_SERVER_REQUIRES_CONFIRMATION:-true}
      - AGENT_TRIGGER_BACKUP_REQUIRES_CONFIRMATION=${AGENT_TRIGGER_BACKUP_REQUIRES_CONFIRMATION:-true}
      - ALERT_MANAGER_URL=${ALERT_MANAGER_URL:-http://alert-manager:8090/api/alerts}
      - BACKUP_MANAGER_URL=${BACKUP_MANAGER_URL:-http://backup-manager:8091}
      - DIAGNOSTICS_WEBAPP_ENABLED=${DIAGNOSTICS_WEBAPP_ENABLED:-false}
      # Diagnostic log inclusion. Requires LOGS_DIAGNOSTIC_ENABLED=true on
      # minecraft-wrapper as well; logs are IP-anonymized unless explicitly disabled.
      - DIAGNOSTICS_LOGS_ENABLED=${DIAGNOSTICS_LOGS_ENABLED:-false}
      - DIAGNOSTICS_LOGS_MAX_LINES=${DIAGNOSTICS_LOGS_MAX_LINES:-500}
      - DIAGNOSTICS_LOGS_ANONYMIZE=${DIAGNOSTICS_LOGS_ANONYMIZE:-true}
      - WEBAPP_URL=${WEBAPP_URL:-http://webapp:8080}

volumes:
  mcserver:
    name: ${VOLUME_NAME:-mcserver}
    external: false
  webapp-data:
    name: ${WEBAPP_VOLUME_NAME:-webapp-data}
    external: false
  alert-manager-data:
    name: ${ALERT_MANAGER_VOLUME_NAME:-alert-manager-data}
    external: false
  backups:
    name: ${BACKUPS_VOLUME_NAME:-backups}
    external: false
  nginx-ssl:
    name: ${NGINX_SSL_VOLUME_NAME:-nginx-ssl}
    external: false
