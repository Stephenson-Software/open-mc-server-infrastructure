{{- if .Values.alertManager.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omcsi.fullname" . }}-alert-manager
  labels:
    {{- include "omcsi.labels" . | nindent 4 }}
    {{- include "omcsi.selectorLabels" (dict "root" . "component" "alert-manager") | nindent 4 }}
spec:
  {{- $alertManagerMaxReplicas := .Values.alertManager.replicaCount }}
  {{- if .Values.alertManager.autoscaling.enabled }}
  {{- $alertManagerMaxReplicas = .Values.alertManager.autoscaling.maxReplicas }}
  {{- end }}
  {{- if and (gt (int $alertManagerMaxReplicas) 1) .Values.persistence.alertManagerData.enabled (eq .Values.persistence.alertManagerData.accessMode "ReadWriteOnce") }}
  {{- fail "alertManager.replicaCount (or alertManager.autoscaling.maxReplicas when autoscaling is enabled) must be 1 when persistence.alertManagerData uses ReadWriteOnce access mode" }}
  {{- end }}
  {{- if not .Values.alertManager.autoscaling.enabled }}
  replicas: {{ .Values.alertManager.replicaCount }}
  {{- end }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "omcsi.selectorLabels" (dict "root" . "component" "alert-manager") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "omcsi.labels" . | nindent 8 }}
        {{- include "omcsi.selectorLabels" (dict "root" . "component" "alert-manager") | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: alert-manager
          image: "{{ .Values.alertManager.image.repository }}:{{ .Values.alertManager.image.tag }}"
          imagePullPolicy: {{ .Values.alertManager.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          env:
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "omcsi.secretName" . }}
                  key: DISCORD_WEBHOOK_URL
            - name: DISCORD_ENABLED
              value: {{ .Values.alertManager.env.DISCORD_ENABLED | quote }}
            - name: MINECRAFT_RCON_HOST
              value: "{{ include "omcsi.minecraftWrapperHost" . }}-internal"
            - name: MINECRAFT_RCON_PORT
              value: {{ .Values.minecraftWrapper.internalService.rconPort | quote }}
            - name: MINECRAFT_RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "omcsi.secretName" . }}
                  key: RCON_PASSWORD
            - name: MINECRAFT_RCON_ENABLED
              value: {{ .Values.alertManager.env.MINECRAFT_RCON_ENABLED | quote }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.alertManager.resources | nindent 12 }}
          volumeMounts:
            - name: alert-manager-data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: alert-manager-data
          {{- if .Values.persistence.alertManagerData.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "omcsi.fullname" . }}-alert-manager-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omcsi.alertManagerHost" . }}
  labels:
    {{- include "omcsi.labels" . | nindent 4 }}
    {{- include "omcsi.selectorLabels" (dict "root" . "component" "alert-manager") | nindent 4 }}
    {{- if ne "false" (toString ((.Values.monitoring).enabled)) }}
    omcsi.io/metrics: "true"
    {{- end }}
spec:
  type: {{ .Values.alertManager.service.type }}
  ports:
    - port: {{ .Values.alertManager.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "omcsi.selectorLabels" (dict "root" . "component" "alert-manager") | nindent 4 }}
{{- end }}
