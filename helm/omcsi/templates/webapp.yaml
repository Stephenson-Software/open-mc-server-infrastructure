apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omcsi.fullname" . }}-webapp
  labels:
    {{- include "omcsi.labels" . | nindent 4 }}
    {{- include "omcsi.selectorLabels" (dict "root" . "component" "webapp") | nindent 4 }}
spec:
  {{- $webappMaxReplicas := .Values.webapp.replicaCount }}
  {{- if .Values.webapp.autoscaling.enabled }}
  {{- $webappMaxReplicas = .Values.webapp.autoscaling.maxReplicas }}
  {{- end }}
  {{- if and (gt (int $webappMaxReplicas) 1) (or (and .Values.persistence.mcserver.enabled (eq .Values.persistence.mcserver.accessMode "ReadWriteOnce")) (and .Values.persistence.webappData.enabled (eq .Values.persistence.webappData.accessMode "ReadWriteOnce"))) }}
  {{- fail "webapp.replicaCount (or webapp.autoscaling.maxReplicas when autoscaling is enabled) must be 1 when a mounted PVC uses ReadWriteOnce access mode (persistence.mcserver or persistence.webappData)" }}
  {{- end }}
  {{- if not .Values.webapp.autoscaling.enabled }}
  replicas: {{ .Values.webapp.replicaCount }}
  {{- end }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "omcsi.selectorLabels" (dict "root" . "component" "webapp") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "omcsi.labels" . | nindent 8 }}
        {{- include "omcsi.selectorLabels" (dict "root" . "component" "webapp") | nindent 8 }}
    spec:
      {{- include "omcsi.mcserverAffinity" . | nindent 6 }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-wrapper
          image: busybox:1.36
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - sh
            - -c
            - |
              attempt=0
              until wget -T 5 -qO /dev/null http://{{ include "omcsi.minecraftWrapperHost" . }}-internal:{{ .Values.minecraftWrapper.internalService.wrapperPort }}/actuator/health; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 60 ]; then
                  echo "ERROR: minecraft-wrapper did not become healthy after $attempt attempts. Check wrapper logs."
                  exit 1
                fi
                echo "Waiting for minecraft-wrapper (attempt $attempt/60)..."
                sleep 5
              done
              echo "minecraft-wrapper is healthy"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: webapp
          image: "{{ .Values.webapp.image.repository }}:{{ .Values.webapp.image.tag }}"
          imagePullPolicy: {{ .Values.webapp.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MC_HOST
              value: "{{ include "omcsi.minecraftWrapperHost" . }}-internal"
            - name: MC_RCON_PORT
              value: {{ .Values.minecraftWrapper.internalService.rconPort | quote }}
            - name: MC_RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "omcsi.secretName" . }}
                  key: RCON_PASSWORD
            - name: MC_MOTD
              value: {{ .Values.webapp.env.MC_MOTD | quote }}
            - name: MC_MAX_PLAYERS
              value: {{ .Values.webapp.env.MC_MAX_PLAYERS | quote }}
            - name: DYNMAP_URL
              value: {{ .Values.webapp.env.DYNMAP_URL | quote }}
            - name: BLUEMAP_URL
              value: {{ .Values.webapp.env.BLUEMAP_URL | quote }}
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "omcsi.secretName" . }}
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "omcsi.secretName" . }}
                  key: ADMIN_PASSWORD
            - name: WEB_REFRESH_INTERVAL_MS
              value: {{ .Values.webapp.env.WEB_REFRESH_INTERVAL_MS | quote }}
            - name: ACTIVITY_TRACKER_URL
              value: {{ .Values.webapp.env.ACTIVITY_TRACKER_URL | quote }}
            - name: ACTIVITY_TRACKER_ENABLED
              value: {{ .Values.webapp.env.ACTIVITY_TRACKER_ENABLED | quote }}
            - name: DASHBOARD_TITLE
              value: {{ .Values.webapp.env.DASHBOARD_TITLE | quote }}
            - name: DASHBOARD_SUBTITLE
              value: {{ .Values.webapp.env.DASHBOARD_SUBTITLE | quote }}
            - name: DASHBOARD_PRIMARY_COLOR
              value: {{ .Values.webapp.env.DASHBOARD_PRIMARY_COLOR | quote }}
            - name: DASHBOARD_SECONDARY_COLOR
              value: {{ .Values.webapp.env.DASHBOARD_SECONDARY_COLOR | quote }}
            - name: DASHBOARD_DARK_MODE
              value: {{ .Values.webapp.env.DASHBOARD_DARK_MODE | quote }}
            - name: DATA_STORAGE_PATH
              value: "/app/data"
            # Full alerts endpoint, matching minecraft-wrapper/backup-manager/agent-manager.
            - name: ALERT_MANAGER_URL
              value: "http://{{ include "omcsi.alertManagerHost" . }}:{{ .Values.alertManager.service.port }}/api/alerts"
            - name: ALERT_MANAGER_ENABLED
              value: {{ .Values.webapp.env.ALERT_MANAGER_ENABLED | quote }}
            - name: MINECRAFT_WRAPPER_URL
              value: "http://{{ include "omcsi.minecraftWrapperHost" . }}-internal:{{ .Values.minecraftWrapper.internalService.wrapperPort }}"
            - name: ACCORDION_CHAT_URL
              value: {{ .Values.webapp.env.ACCORDION_CHAT_URL | quote }}
            - name: MINECRAFT_WRAPPER_ENABLED
              value: {{ .Values.webapp.env.MINECRAFT_WRAPPER_ENABLED | quote }}
            - name: WORLD_DIRECTORY
              value: {{ .Values.webapp.env.WORLD_DIRECTORY | quote }}
            - name: MAX_FILE_UPLOAD_SIZE
              value: {{ .Values.webapp.env.MAX_FILE_UPLOAD_SIZE | quote }}
            - name: MAX_REQUEST_UPLOAD_SIZE
              value: {{ .Values.webapp.env.MAX_REQUEST_UPLOAD_SIZE | quote }}
            - name: MULTIPART_TEMP_DIR
              value: {{ .Values.webapp.env.MULTIPART_TEMP_DIR | quote }}
            - name: WORLD_UPLOAD_READ_TIMEOUT_SECONDS
              value: {{ .Values.webapp.env.WORLD_UPLOAD_READ_TIMEOUT_SECONDS | quote }}
            - name: DEPLOYMENT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "omcsi.secretName" . }}
                  key: DEPLOYMENT_AUTH_TOKEN
            # The webapp authenticates to the wrapper's POST /api/world/upload with this
            # token, so it needs the same secret the wrapper validates against.
            - name: DEPLOY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "omcsi.secretName" . }}
                  key: DEPLOY_AUTH_TOKEN
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.webapp.resources | nindent 12 }}
          volumeMounts:
            - name: webapp-data
              mountPath: /app/data
            - name: mcserver
              mountPath: /mcserver
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: webapp-data
          {{- if .Values.persistence.webappData.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "omcsi.fullname" . }}-webapp-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: mcserver
          {{- if .Values.persistence.mcserver.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "omcsi.fullname" . }}-mcserver
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omcsi.webappHost" . }}
  labels:
    {{- include "omcsi.labels" . | nindent 4 }}
    {{- include "omcsi.selectorLabels" (dict "root" . "component" "webapp") | nindent 4 }}
    {{- if ne "false" (toString ((.Values.monitoring).enabled)) }}
    omcsi.io/metrics: "true"
    {{- end }}
spec:
  type: {{ .Values.webapp.service.type }}
  ports:
    - port: {{ .Values.webapp.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "omcsi.selectorLabels" (dict "root" . "component" "webapp") | nindent 4 }}
