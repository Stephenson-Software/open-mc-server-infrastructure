{{- if ne "false" (toString ((.Values.networkPolicy).enabled)) }}
# =============================================================================
# NetworkPolicies — one per service.
#
# Each policy sets policyTypes: [Ingress, Egress], which implicitly denies
# all traffic not matched by an allow rule.
#
# Health-probe ports are opened to 0.0.0.0/0 because kubelet probes originate
# from the node host network (outside any pod namespace) and cannot be matched
# by a namespaceSelector or podSelector.  In most CNI implementations (Calico,
# Canal) host-network traffic bypasses pod NetworkPolicies anyway, but the
# explicit rule ensures broad CNI compatibility.
# =============================================================================

# ---------------------------------------------------------------------------
# minecraft-wrapper
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "omcsi.fullname" . }}-minecraft-wrapper
  labels:
    {{- include "omcsi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "omcsi.selectorLabels" (dict "root" . "component" "minecraft-wrapper") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Player connections (public game port)
    - ports:
        - port: 25565
          protocol: TCP
      from:
        - ipBlock:
            cidr: 0.0.0.0/0
    # Wrapper REST API — internal callers + kubelet health probes (node network)
    - ports:
        - port: 8092
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "omcsi.selectorLabels" (dict "root" . "component" "webapp") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "omcsi.selectorLabels" (dict "root" . "component" "agent-manager") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "omcsi.selectorLabels" (dict "root" . "component" "nginx") | nindent 14 }}
        - ipBlock:
            cidr: {{ ((.Values.networkPolicy).kubeNodeCIDR) | default "0.0.0.0/0" | quote }}
    # Prometheus scrape of wrapper actuator metrics (cross-namespace)
    {{- if ne "false" (toString ((.Values.monitoring).enabled)) }}
    - ports:
        - port: {{ .Values.minecraftWrapper.internalService.wrapperPort }}
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoring.prometheusNamespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
    {{- end }}
    # BlueMap traffic from nginx
    - ports:
        - port: 8100
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "omcsi.selectorLabels" (dict "root" . "component" "nginx") | nindent 14 }}
    # RCON from webapp and alert-manager (restricted — not open to the cluster)
    - ports:
        - port: 25575
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "omcsi.selectorLabels" (dict "root" . "component" "webapp") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "omcsi.selectorLabels" (dict "root" . "component" "alert-manager") | nindent 14 }}
  egress:
    # Alert notifications
    - ports:
        - port: {{ .Values.alertManager.service.port }}
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              {{- include "omcsi.selectorLabels" (dict "root" . "component" "alert-manager") | nindent 14 }}
    # Webapp notifications (WEBAPP_URL — deployment history, etc.)
    - ports:
        - port: {{ .Values.webapp.service.port }}
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              {{- include "omcsi.selectorLabels" (dict "root" . "component" "webapp") | nindent 14 }}
    # Mojang authentication (online-mode=true) and any other external HTTPS
    # Required for player login via api.minecraftservices.com / sessionserver.mojang.com,
    # and also covers DEFAULT_PLUGINS downloads (post-create.sh fetches plugin JARs
    # over HTTPS during server setup) and the wrapper's one usage-reporting POST to
    # USAGE_REPORTING_ENDPOINT (https://trace.danielstephenson.dev by default).
    - ports:
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
    # DNS — scoped to CoreDNS (adjust networkPolicy.dnsNamespaceSelector/dnsPodSelector for non-standard distros)
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      {{- if and ((.Values.networkPolicy).dnsNamespaceSelector) ((.Values.networkPolicy).dnsPodSelector) }}
      to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.dnsPodSelector | nindent 12 }}
      {{- end }}
---
# ---------------------------------------------------------------------------
# webapp
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "omcsi.fullname" . }}-webapp
  labels:
    {{- include "omcsi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "omcsi.selectorLabels" (dict "root" . "component" "webapp") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Dashboard traffic from nginx + kubelet health probes (node network)
    - ports:
        - port: 8080
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "omcsi.selectorLabels" (dict "root" . "component" "nginx") | nindent 14 }}
        - ipBlock:
            cidr: {{ ((.Values.networkPolicy).kubeNodeCIDR) | default "0.0.0.0/0" | quote }}
    # Prometheus scrape of webapp actuator metrics (cross-namespace)
    {{- if ne "false" (toString ((.Values.monitoring).enabled)) }}
    - ports:
        - port: 8080
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoring.prometheusNamespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
    {{- end }}
  egress:
    # Minecraft wrapper API and RCON
    - ports:
        - port: {{ .Values.minecraftWrapper.internalService.wrapperPort }}
          protocol: TCP
        - port: {{ .Values.minecraftWrapper.internalService.rconPort }}
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              {{- include "omcsi.selectorLabels" (dict "root" . "component" "minecraft-wrapper") | nindent 14 }}
    # Alert notifications
    - ports:
        - port: {{ .Values.alertManager.service.port }}
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              {{- include "omcsi.selectorLabels" (dict "root" . "component" "alert-manager") | nindent 14 }}
    # DNS — scoped to CoreDNS (adjust networkPolicy.dnsNamespaceSelector/dnsPodSelector for non-standard distros)
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      {{- if and ((.Values.networkPolicy).dnsNamespaceSelector) ((.Values.networkPolicy).dnsPodSelector) }}
      to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.dnsPodSelector | nindent 12 }}
      {{- end }}
---
# ---------------------------------------------------------------------------
# nginx
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "omcsi.fullname" . }}-nginx
  labels:
    {{- include "omcsi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "omcsi.selectorLabels" (dict "root" . "component" "nginx") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # External HTTP/HTTPS traffic + kubelet probes
    - ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
      from:
        - ipBlock:
            cidr: 0.0.0.0/0
  egress:
    # Webapp upstream
    - ports:
        - port: {{ .Values.webapp.service.port }}
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              {{- include "omcsi.selectorLabels" (dict "root" . "component" "webapp") | nindent 14 }}
    # minecraft-wrapper plugin deploy endpoint
    - ports:
        - port: {{ .Values.minecraftWrapper.internalService.wrapperPort }}
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              {{- include "omcsi.selectorLabels" (dict "root" . "component" "minecraft-wrapper") | nindent 14 }}
    # BlueMap's webserver. The wrapper's ingress rules already accept this from
    # nginx; without the matching egress rule here the packets are dropped on the
    # way out and the proxy returns 504 after its read timeout rather than failing
    # fast, which makes it look like BlueMap is down.
    - ports:
        - port: {{ .Values.minecraftWrapper.internalService.bluemapPort }}
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              {{- include "omcsi.selectorLabels" (dict "root" . "component" "minecraft-wrapper") | nindent 14 }}
    # DNS — scoped to CoreDNS (adjust networkPolicy.dnsNamespaceSelector/dnsPodSelector for non-standard distros)
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      {{- if and ((.Values.networkPolicy).dnsNamespaceSelector) ((.Values.networkPolicy).dnsPodSelector) }}
      to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.dnsPodSelector | nindent 12 }}
      {{- end }}
---
