{{- if .Values.backupManager.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omcsi.fullname" . }}-backup-manager
  labels:
    {{- include "omcsi.labels" . | nindent 4 }}
    {{- include "omcsi.selectorLabels" (dict "root" . "component" "backup-manager") | nindent 4 }}
spec:
  {{- if and (gt (int .Values.backupManager.replicaCount) 1) (or (and .Values.persistence.mcserver.enabled (eq .Values.persistence.mcserver.accessMode "ReadWriteOnce")) (and .Values.persistence.backups.enabled (eq .Values.persistence.backups.accessMode "ReadWriteOnce"))) }}
  {{- fail "backupManager.replicaCount must be 1 when a mounted PVC uses ReadWriteOnce access mode (persistence.mcserver or persistence.backups)" }}
  {{- end }}
  replicas: {{ .Values.backupManager.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "omcsi.selectorLabels" (dict "root" . "component" "backup-manager") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "omcsi.labels" . | nindent 8 }}
        {{- include "omcsi.selectorLabels" (dict "root" . "component" "backup-manager") | nindent 8 }}
    spec:
      {{- include "omcsi.mcserverAffinity" . | nindent 6 }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backup-manager
          image: "{{ .Values.backupManager.image.repository }}:{{ .Values.backupManager.image.tag }}"
          imagePullPolicy: {{ .Values.backupManager.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8091
              protocol: TCP
          env:
            - name: BACKUP_DIRECTORY
              value: {{ .Values.backupManager.env.BACKUP_DIRECTORY | quote }}
            - name: BACKUP_MAX_SIZE_MB
              value: {{ .Values.backupManager.env.BACKUP_MAX_SIZE_MB | quote }}
            {{- if .Values.backupManager.env.BACKUP_SCHEDULE }}
            - name: BACKUP_SCHEDULE
              value: {{ .Values.backupManager.env.BACKUP_SCHEDULE | quote }}
            {{- end }}
            - name: SOURCE_DIRECTORY
              value: {{ .Values.backupManager.env.SOURCE_DIRECTORY | default "/mcserver" | quote }}
            # Both forced off when alertManager.enabled=false: there is nothing to
            # deliver to, and every backup would otherwise log a failed POST.
            - name: ALERTS_BACKUP_SUCCESS
              value: {{ if .Values.alertManager.enabled }}{{ .Values.backupManager.env.ALERTS_BACKUP_SUCCESS | quote }}{{ else }}"false"{{ end }}
            - name: ALERTS_BACKUP_FAILURE
              value: {{ if .Values.alertManager.enabled }}{{ .Values.backupManager.env.ALERTS_BACKUP_FAILURE | quote }}{{ else }}"false"{{ end }}
            - name: ALERT_MANAGER_URL
              value: "http://{{ include "omcsi.alertManagerHost" . }}:{{ .Values.alertManager.service.port }}/api/alerts"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backupManager.resources | nindent 12 }}
          volumeMounts:
            - name: mcserver
              mountPath: /mcserver
              readOnly: true
            - name: backups
              mountPath: {{ .Values.backupManager.env.BACKUP_DIRECTORY | quote }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: mcserver
          {{- if .Values.persistence.mcserver.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "omcsi.fullname" . }}-mcserver
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: backups
          {{- if .Values.persistence.backups.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "omcsi.fullname" . }}-backups
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omcsi.backupManagerHost" . }}
  labels:
    {{- include "omcsi.labels" . | nindent 4 }}
    {{- include "omcsi.selectorLabels" (dict "root" . "component" "backup-manager") | nindent 4 }}
    {{- if ne "false" (toString ((.Values.monitoring).enabled)) }}
    omcsi.io/metrics: "true"
    {{- end }}
spec:
  type: {{ .Values.backupManager.service.type }}
  ports:
    - port: {{ .Values.backupManager.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "omcsi.selectorLabels" (dict "root" . "component" "backup-manager") | nindent 4 }}
{{- end }}
