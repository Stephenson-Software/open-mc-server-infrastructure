apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omcsi.fullname" . }}-nginx-config
  labels:
    {{- include "omcsi.labels" . | nindent 4 }}
data:
  nginx.conf: |
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        # File upload size limit.  This is the effective cap for dashboard
        # uploads whenever it is lower than the web app's own multipart limit
        # (webapp.env.MAX_FILE_UPLOAD_SIZE).
        client_max_body_size {{ .Values.nginx.maxBodySize }};

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        access_log /dev/stdout;
        error_log  /dev/stderr;

        # HTTP server – redirect to HTTPS
        server {
            listen 80;
            server_name _;

            location / {
                return 301 https://$host$request_uri;
            }
        }

        # HTTPS server
        server {
            listen 443 ssl;
            server_name _;

            ssl_certificate     /etc/nginx/ssl/cert.pem;
            ssl_certificate_key /etc/nginx/ssl/key.pem;

            location /api/plugins/ {
                proxy_pass http://{{ include "omcsi.fullname" . }}-minecraft-wrapper-internal:{{ .Values.minecraftWrapper.internalService.wrapperPort }};
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                # Stream the body straight through rather than spooling the whole
                # upload to nginx's temp directory first.
                proxy_request_buffering off;

                proxy_connect_timeout 60s;
                proxy_send_timeout    {{ .Values.nginx.uploadTimeout }};
                proxy_read_timeout    {{ .Values.nginx.uploadTimeout }};
            }

            # World upload/list/delete are served by the web app, but an upload can run
            # for far longer than the 60s the dashboard's other requests need, and a
            # multi-GB body must not be spooled to disk inside the nginx container. Both
            # are why this is a separate location from the catch-all below.
            location /api/world/ {
                proxy_pass http://{{ include "omcsi.webappHost" . }}:{{ .Values.webapp.service.port }};
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                proxy_request_buffering off;

                proxy_connect_timeout 60s;
                proxy_send_timeout    {{ .Values.nginx.uploadTimeout }};
                proxy_read_timeout    {{ .Values.nginx.uploadTimeout }};
            }

            location / {
                proxy_pass http://{{ include "omcsi.webappHost" . }}:{{ .Values.webapp.service.port }};
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                # WebSocket support
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";

                proxy_connect_timeout 60s;
                proxy_send_timeout    60s;
                proxy_read_timeout    60s;
            }
        }
    }
