apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omcsi.fullname" . }}-minecraft-wrapper
  labels:
    {{- include "omcsi.labels" . | nindent 4 }}
    {{- include "omcsi.selectorLabels" (dict "root" . "component" "minecraft-wrapper") | nindent 4 }}
spec:
  # Minecraft server must run as a single instance — world data cannot be
  # shared safely across replicas.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "omcsi.selectorLabels" (dict "root" . "component" "minecraft-wrapper") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "omcsi.labels" . | nindent 8 }}
        {{- include "omcsi.selectorLabels" (dict "root" . "component" "minecraft-wrapper") | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 45
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: minecraft-wrapper
          image: "{{ .Values.minecraftWrapper.image.repository }}:{{ .Values.minecraftWrapper.image.tag }}"
          imagePullPolicy: {{ .Values.minecraftWrapper.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
            - name: rcon
              containerPort: 25575
              protocol: TCP
            - name: bluemap
              containerPort: 8100
              protocol: TCP
            - name: wrapper
              containerPort: 8092
              protocol: TCP
          env:
            - name: MINECRAFT_VERSION
              value: {{ .Values.minecraftWrapper.env.MINECRAFT_VERSION | quote }}
            - name: OPERATOR_UUID
              value: {{ .Values.minecraftWrapper.env.OPERATOR_UUID | quote }}
            - name: OPERATOR_NAME
              value: {{ .Values.minecraftWrapper.env.OPERATOR_NAME | quote }}
            - name: OPERATOR_LEVEL
              value: {{ .Values.minecraftWrapper.env.OPERATOR_LEVEL | quote }}
            - name: OVERWRITE_EXISTING_SERVER
              value: {{ .Values.minecraftWrapper.env.OVERWRITE_EXISTING_SERVER | quote }}
            - name: MINECRAFT_AUTO_START
              value: {{ .Values.minecraftWrapper.env.MINECRAFT_AUTO_START | quote }}
            - name: MINECRAFT_AUTO_RESTART
              value: {{ .Values.minecraftWrapper.env.MINECRAFT_AUTO_RESTART | quote }}
            - name: SERVER_MOTD
              value: {{ .Values.minecraftWrapper.env.SERVER_MOTD | quote }}
            - name: MAX_PLAYERS
              value: {{ .Values.minecraftWrapper.env.MAX_PLAYERS | quote }}
            - name: DIFFICULTY
              value: {{ .Values.minecraftWrapper.env.DIFFICULTY | quote }}
            - name: GAMEMODE
              value: {{ .Values.minecraftWrapper.env.GAMEMODE | quote }}
            - name: PVP_ENABLED
              value: {{ .Values.minecraftWrapper.env.PVP_ENABLED | quote }}
            - name: ONLINE_MODE
              value: {{ .Values.minecraftWrapper.env.ONLINE_MODE | quote }}
            - name: JAVA_OPTS
              value: {{ .Values.minecraftWrapper.env.JAVA_OPTS | quote }}
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "omcsi.secretName" . }}
                  key: RCON_PASSWORD
            - name: ALERT_MANAGER_URL
              value: "http://{{ include "omcsi.alertManagerHost" . }}:{{ .Values.alertManager.service.port }}/api/alerts"
            - name: ALERTS_SERVER_START
              value: {{ .Values.minecraftWrapper.env.ALERTS_SERVER_START | quote }}
            - name: ALERTS_SERVER_STOP
              value: {{ .Values.minecraftWrapper.env.ALERTS_SERVER_STOP | quote }}
            - name: ALERTS_SERVER_CRASH
              value: {{ .Values.minecraftWrapper.env.ALERTS_SERVER_CRASH | quote }}
            - name: ALERTS_CONFIG_WARNING
              value: {{ .Values.minecraftWrapper.env.ALERTS_CONFIG_WARNING | quote }}
            - name: ALERTS_PLUGIN_DEPLOY
              value: {{ .Values.minecraftWrapper.env.ALERTS_PLUGIN_DEPLOY | quote }}
            - name: ALERTS_WORLD_UPLOAD
              value: {{ .Values.minecraftWrapper.env.ALERTS_WORLD_UPLOAD | quote }}
            # ALERTS_UPGRADE_START/COMPLETE/FAILURE are intentionally absent: their only
            # consumer is upgrade.sh, a host-side script that drives `docker compose`
            # directly, so they are Docker Compose-only and inert inside this container.
            - name: DEPLOY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "omcsi.secretName" . }}
                  key: DEPLOY_AUTH_TOKEN
            - name: PLUGINS_DIRECTORY
              value: {{ .Values.minecraftWrapper.env.PLUGINS_DIRECTORY | quote }}
            - name: DEFAULT_PLUGINS
              value: {{ .Values.minecraftWrapper.env.DEFAULT_PLUGINS | quote }}
            - name: WORLD_DIRECTORY
              value: {{ .Values.minecraftWrapper.env.WORLD_DIRECTORY | quote }}
            - name: MAX_FILE_UPLOAD_SIZE
              value: {{ .Values.minecraftWrapper.env.MAX_FILE_UPLOAD_SIZE | quote }}
            - name: MAX_REQUEST_UPLOAD_SIZE
              value: {{ .Values.minecraftWrapper.env.MAX_REQUEST_UPLOAD_SIZE | quote }}
            - name: MULTIPART_TEMP_DIR
              value: {{ .Values.minecraftWrapper.env.MULTIPART_TEMP_DIR | quote }}
            - name: WORLD_UPLOAD_MAX_FILE_SIZE_MB
              value: {{ .Values.minecraftWrapper.env.WORLD_UPLOAD_MAX_FILE_SIZE_MB | quote }}
            - name: WORLD_UPLOAD_MAX_EXTRACTED_MB
              value: {{ .Values.minecraftWrapper.env.WORLD_UPLOAD_MAX_EXTRACTED_MB | quote }}
            - name: WORLD_UPLOAD_MAX_ENTRIES
              value: {{ .Values.minecraftWrapper.env.WORLD_UPLOAD_MAX_ENTRIES | quote }}
            - name: WEBAPP_URL
              value: "http://{{ include "omcsi.webappHost" . }}:{{ .Values.webapp.service.port }}"
            - name: DEPLOYMENT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "omcsi.secretName" . }}
                  key: DEPLOYMENT_AUTH_TOKEN
            - name: LOGS_DIAGNOSTIC_ENABLED
              value: {{ .Values.minecraftWrapper.env.LOGS_DIAGNOSTIC_ENABLED | quote }}
            - name: LOGS_DIAGNOSTIC_MAX_LINES
              value: {{ .Values.minecraftWrapper.env.LOGS_DIAGNOSTIC_MAX_LINES | quote }}
          # startupProbe gives the JVM time to initialise before liveness kicks in.
          # failureThreshold × periodSeconds = 10 minutes — enough for Spigot's
          # first-boot BuildTools compilation.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: wrapper
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: wrapper
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: wrapper
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.minecraftWrapper.resources | nindent 12 }}
          volumeMounts:
            - name: mcserver
              mountPath: /mcserver
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: mcserver
          {{- if .Values.persistence.mcserver.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "omcsi.fullname" . }}-mcserver
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
---
# External Service – exposes only the Minecraft game port
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omcsi.minecraftWrapperHost" . }}
  labels:
    {{- include "omcsi.labels" . | nindent 4 }}
    {{- include "omcsi.selectorLabels" (dict "root" . "component" "minecraft-wrapper") | nindent 4 }}
spec:
  type: {{ .Values.minecraftWrapper.service.type }}
  ports:
    - port: {{ .Values.minecraftWrapper.service.minecraftPort }}
      targetPort: minecraft
      protocol: TCP
      name: minecraft
      {{- if and (eq .Values.minecraftWrapper.service.type "NodePort") .Values.minecraftWrapper.service.nodePort }}
      nodePort: {{ .Values.minecraftWrapper.service.nodePort }}
      {{- end }}
  selector:
    {{- include "omcsi.selectorLabels" (dict "root" . "component" "minecraft-wrapper") | nindent 4 }}
---
# Internal Service – RCON, BlueMap, and wrapper API (ClusterIP only)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omcsi.minecraftWrapperHost" . }}-internal
  labels:
    {{- include "omcsi.labels" . | nindent 4 }}
    {{- include "omcsi.selectorLabels" (dict "root" . "component" "minecraft-wrapper") | nindent 4 }}
    {{- if ne "false" (toString ((.Values.monitoring).enabled)) }}
    omcsi.io/metrics: "true"
    {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.minecraftWrapper.internalService.rconPort }}
      targetPort: rcon
      protocol: TCP
      name: rcon
    - port: {{ .Values.minecraftWrapper.internalService.bluemapPort }}
      targetPort: bluemap
      protocol: TCP
      name: bluemap
    - port: {{ .Values.minecraftWrapper.internalService.wrapperPort }}
      targetPort: wrapper
      protocol: TCP
      name: wrapper
  selector:
    {{- include "omcsi.selectorLabels" (dict "root" . "component" "minecraft-wrapper") | nindent 4 }}
