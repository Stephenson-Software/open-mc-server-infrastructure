{{- if .Values.persistence.mcserver.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "omcsi.fullname" . }}-mcserver
  labels:
    {{- include "omcsi.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.mcserver.accessMode }}
  {{- if .Values.persistence.mcserver.storageClass }}
  storageClassName: {{ .Values.persistence.mcserver.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.mcserver.size }}
{{- end }}
---
{{- if .Values.persistence.webappData.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "omcsi.fullname" . }}-webapp-data
