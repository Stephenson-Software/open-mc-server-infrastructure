# =============================================================================
# Open Minecraft Server Infrastructure – Helm values
# =============================================================================
# Most application-level variables from sample.env have a corresponding entry
# below. Some values are intentionally fixed or computed in the templates
# (e.g., DATA_STORAGE_PATH is hardcoded to match the PVC mount, internal
# service URLs like ALERT_MANAGER_URL/WEBAPP_URL/BACKUP_MANAGER_URL are
# derived from Helm helpers, and RCON port references are sourced from
# minecraftWrapper.internalService.rconPort). Docker Compose-only variables
# (container names, host port mappings, and volume names) are also excluded —
# Kubernetes manages these natively via Deployment names, Service specs, and
# PVC names.
#
# Sensitive values are placed under the `secrets` key and stored in a k8s
# Secret. Override them via --set or a separate values file.
# =============================================================================

# ---------------------------------------------------------------------------
# Global / Shared
# ---------------------------------------------------------------------------
global:
  # Namespace is normally set by --namespace; this is informational only.
  namespace: ""

# ---------------------------------------------------------------------------
# Minecraft Server + Wrapper
# ---------------------------------------------------------------------------
minecraftWrapper:
  image:
    repository: dmccoystephenson/open-mc-server
    tag: latest
    pullPolicy: Always
  # replicaCount is fixed at 1 — a single Minecraft server instance must own
  # the world data exclusively.  The value is hardcoded in the template.
  resources:
    requests:
      cpu: "500m"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 8Gi
  service:
    # External service exposes only the Minecraft game port.
    type: NodePort
    minecraftPort: 25565
    # Optional fixed NodePort for the Minecraft game port. Only applied when
    # type is "NodePort". Leave empty to let Kubernetes auto-assign a port from
    # the cluster's service-node-port-range (default 30000-32767). To serve the
    # standard 25565 directly on the node IP (single-node / bare-VPS setups),
    # set this to 25565 AND widen the apiserver --service-node-port-range to
    # include it (e.g. 80-32767). See terraform/hetzner for a worked example.
    nodePort: ""
  # Internal ClusterIP service for RCON, BlueMap, and wrapper API.
  internalService:
    rconPort: 25575
    bluemapPort: 8100
    wrapperPort: 8092
  env:
    MINECRAFT_VERSION: "26.1"
    OPERATOR_UUID: "YOUR_UUID_HERE"
    OPERATOR_NAME: "YOUR_USERNAME_HERE"
    OPERATOR_LEVEL: "4"
    OVERWRITE_EXISTING_SERVER: "false"
    MINECRAFT_AUTO_START: "true"
    MINECRAFT_AUTO_RESTART: "false"
    SERVER_MOTD: "An Open Minecraft Server"
    MAX_PLAYERS: "20"
    DIFFICULTY: "normal"
    GAMEMODE: "survival"
    PVP_ENABLED: "true"
    ONLINE_MODE: "true"
    JAVA_OPTS: "-Xmx6G -Xms4G"
    PLUGINS_DIRECTORY: "/mcserver/plugins"
    # Comma-separated list of direct download URLs to plugin JARs, installed
    # automatically on server setup. A plugin already present under
    # PLUGINS_DIRECTORY (matched by filename) is left untouched. Empty by
    # default.
    DEFAULT_PLUGINS: ""
    # Must match webapp.env.WORLD_DIRECTORY: the webapp lists/deletes worlds under
    # this path while the wrapper installs uploaded worlds there, so a mismatch
    # silently hides uploads from the dashboard.
    WORLD_DIRECTORY: "/mcserver/world"
    # World upload limits.  A request meets these in order — nginx.maxBodySize,
    # then the multipart limits, then the WORLD_UPLOAD_* checks — so raising one
    # alone does not raise the effective cap.  See "Upload Size Limits" in
    # README.md for a worked example of raising all of them together.
    MAX_FILE_UPLOAD_SIZE: "2048MB"
    MAX_REQUEST_UPLOAD_SIZE: "2048MB"
    # Buffer directory for an in-flight upload; empty uses the container's
    # writable layer.  Point this at a path on the mcserver volume (e.g.
    # "/mcserver/tmp") before accepting multi-GB archives, so a large upload
    # cannot exhaust the pod's ephemeral storage.
    MULTIPART_TEMP_DIR: ""
    # Largest accepted archive, in MB.
    WORLD_UPLOAD_MAX_FILE_SIZE_MB: "2048"
    # Cap on total extracted size, in MB (zip bomb protection).  A world expands
    # well beyond its compressed size, so keep several times the archive limit
    # here — and make sure persistence.mcserver.size can hold the old world and
    # the extracted new one at the same time.
    WORLD_UPLOAD_MAX_EXTRACTED_MB: "10240"
    # Cap on entry count (zip bomb protection).
    WORLD_UPLOAD_MAX_ENTRIES: "100000"
    # Alert toggles
    ALERTS_SERVER_START: "true"
    ALERTS_SERVER_STOP: "true"
    ALERTS_SERVER_CRASH: "true"
    ALERTS_CONFIG_WARNING: "false"
    ALERTS_PLUGIN_DEPLOY: "true"
    ALERTS_WORLD_UPLOAD: "true"
    # NOTE: ALERTS_UPGRADE_START/COMPLETE/FAILURE are deliberately not listed here.
    # They are read by upgrade.sh on the Docker host, never inside the container,
    # so they have no meaning for the Kubernetes deployment.
    # Diagnostic log access
    LOGS_DIAGNOSTIC_ENABLED: "false"
    LOGS_DIAGNOSTIC_MAX_LINES: "100"

# ---------------------------------------------------------------------------
# Web Application (Dashboard)
# ---------------------------------------------------------------------------
webapp:
  image:
    repository: dmccoystephenson/open-mc-server-webapp
    tag: latest
    pullPolicy: Always
  replicaCount: 1
  resources:
    requests:
      cpu: "100m"
      memory: 256Mi
    limits:
      cpu: "500m"
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8080
  env:
    MC_MOTD: "An Open Minecraft Server"
    MC_MAX_PLAYERS: "20"
    DYNMAP_URL: ""
    BLUEMAP_URL: ""
    WEB_REFRESH_INTERVAL_MS: "1800000"
    ACTIVITY_TRACKER_URL: ""
    ACTIVITY_TRACKER_ENABLED: "false"
    DASHBOARD_TITLE: "Minecraft Server Dashboard"
    DASHBOARD_SUBTITLE: "Server Management & Information"
    DASHBOARD_PRIMARY_COLOR: "#667eea"
    DASHBOARD_SECONDARY_COLOR: "#764ba2"
    DASHBOARD_DARK_MODE: "true"
    ALERT_MANAGER_ENABLED: "true"
    ACCORDION_CHAT_URL: ""
    # Spring multipart limits.  nginx.maxBodySize is the effective upload cap.
    MAX_FILE_UPLOAD_SIZE: "2048MB"
    MAX_REQUEST_UPLOAD_SIZE: "2048MB"
    # Directory Spring buffers an in-flight upload into.  Empty uses the
    # container's own temp directory (its writable layer), which is fine at the
    # default limits; give it a mounted path when raising them into multi-GB
    # territory, or a large upload can exhaust the pod's ephemeral storage.
    MULTIPART_TEMP_DIR: ""
    # How long the web app waits for the wrapper to finish a world upload.  The
    # wrapper replies only after stopping the server, extracting the archive,
    # swapping the world in and restarting, so this tracks world size rather
    # than transfer time.  Keep it at or below nginx.uploadTimeout.
    WORLD_UPLOAD_READ_TIMEOUT_SECONDS: "600"
    MINECRAFT_WRAPPER_ENABLED: "true"
    WORLD_DIRECTORY: "/mcserver/world"
  # webapp mounts the mcserver and webapp-data PVCs directly. Scaling beyond
  # 1 replica requires persistence.mcserver.accessMode AND
  # persistence.webappData.accessMode to both be ReadWriteMany (see the
  # "Multi-Node Scheduling & RWX StorageClasses" section in README.md) —
  # the Deployment template `fail`s otherwise. Requires the metrics-server
  # (or equivalent) API to be installed in the cluster; replicaCount above
  # is ignored once enabled (HPA owns replicas).
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

# ---------------------------------------------------------------------------
# Nginx Reverse Proxy
# ---------------------------------------------------------------------------
nginx:
  image:
    repository: dmccoystephenson/open-mc-server-nginx
    tag: latest
    pullPolicy: Always
  replicaCount: 1
  # Maximum request body size accepted by the proxy (nginx client_max_body_size).
  # nginx sits in front of the web app, so this is the effective upload cap for
  # plugin JARs and world archives: a larger request is rejected with a bare 413
  # before the dashboard sees it.  Raise it together with
  # webapp.env.MAX_FILE_UPLOAD_SIZE / MAX_REQUEST_UPLOAD_SIZE, which use Spring's
  # "2048MB" suffix rather than nginx's "2G".
  maxBodySize: 100M
  # Send/read timeout applied to the upload routes (/api/plugins/, /api/world/)
  # only; the rest of the dashboard keeps nginx's 60s.  A large world archive
  # takes minutes to transfer and minutes more to extract and install, and the
  # client holds the connection open for all of it.
  uploadTimeout: 3600s
  resources:
    requests:
      cpu: "50m"
      memory: 64Mi
    limits:
      cpu: "200m"
      memory: 128Mi
  service:
    type: LoadBalancer
    httpPort: 80
    httpsPort: 443
    # Optional fixed NodePorts for HTTP/HTTPS. Only applied when type is
    # "NodePort". Leave empty to let Kubernetes auto-assign. To serve the
    # dashboard on standard 80/443 directly on the node IP (single-node /
    # bare-VPS setups), set these AND widen the apiserver
    # --service-node-port-range to include them (e.g. 80-32767).
    httpNodePort: ""
    httpsNodePort: ""
  # nginx has no PVC and no in-memory session state, so it can always be
  # horizontally scaled safely. Requires the metrics-server (or equivalent)
  # API to be installed in the cluster; replicaCount above is ignored once
  # enabled (HPA owns replicas).
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  tls:
    # When true, a self-signed certificate is generated via an init container
    # (same behaviour as the Docker Compose setup).
    # Set to false and supply a kubernetes.io/tls Secret named
    # {{ include "omcsi.fullname" . }}-nginx-tls (typically <release>-nginx-tls
    # when the release name already contains "omcsi", otherwise
    # <release>-omcsi-nginx-tls). The Secret's tls.crt / tls.key are mapped
    # to the cert.pem / key.pem paths that nginx expects.
    selfSigned: true
  # nginx needs NET_BIND_SERVICE to bind to ports 80/443.  Running as a
  # non-root user (UID 1000) means CHOWN/SETUID/SETGID are no longer needed.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop: [ALL]
      add: [NET_BIND_SERVICE]

# ---------------------------------------------------------------------------
# Backup Manager
# ---------------------------------------------------------------------------
backupManager:
  image:
    repository: dmccoystephenson/open-mc-server-backup-manager
    tag: latest
    pullPolicy: Always
  replicaCount: 1
  resources:
    requests:
      cpu: "100m"
      memory: 256Mi
    limits:
      cpu: "500m"
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8091
  env:
    BACKUP_DIRECTORY: "/backups"
    BACKUP_MAX_SIZE_MB: "10240"
    # Cron expression: seconds minutes hours day-of-month month day-of-week
    # Default: 2:00 AM every day (server/container local time)
    # Set to "-" to disable scheduled backups entirely; the manual
    # POST /api/backups/trigger endpoint keeps working either way.
    BACKUP_SCHEDULE: "0 0 2 * * ?"
    SOURCE_DIRECTORY: "/mcserver"
    ALERTS_BACKUP_SUCCESS: "true"
    ALERTS_BACKUP_FAILURE: "true"

# ---------------------------------------------------------------------------
# Alert Manager
# ---------------------------------------------------------------------------
alertManager:
  image:
    repository: dmccoystephenson/open-mc-server-alert-manager
    tag: latest
    pullPolicy: Always
  replicaCount: 1
  resources:
    requests:
      cpu: "100m"
      memory: 256Mi
    limits:
      cpu: "500m"
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8090
  env:
    DISCORD_ENABLED: "false"
    MINECRAFT_RCON_ENABLED: "true"
  # alert-manager mounts the alert-manager-data PVC directly. Scaling beyond
  # 1 replica requires persistence.alertManagerData.accessMode to be
  # ReadWriteMany (see the "Multi-Node Scheduling & RWX StorageClasses"
  # section in README.md) — the Deployment template `fail`s otherwise.
  # Requires the metrics-server (or equivalent) API to be installed in the
  # cluster; replicaCount above is ignored once enabled (HPA owns replicas).
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

# ---------------------------------------------------------------------------
# Agent Manager (Discord AI bot)
# ---------------------------------------------------------------------------
agentManager:
  enabled: false
  image:
    repository: dmccoystephenson/open-mc-server-agent-manager
    tag: latest
    pullPolicy: Always
  replicaCount: 1
  resources:
    requests:
      cpu: "100m"
      memory: 256Mi
    limits:
      cpu: "500m"
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8093
  env:
    # Defaults to true so that enabling the agent-manager Deployment
    # (agentManager.enabled=true) also activates the bot. Override to "false"
    # to deploy the pod without starting the agent.
    AGENT_ENABLED: "true"
    # Anthropic model the agent uses for every Messages API call.
    AGENT_ANTHROPIC_MODEL: "claude-sonnet-4-20250514"
    # Maximum output tokens per Anthropic response. Raise this if answers that
    # summarise get_server_diagnostics output are being cut short; lower it to
    # cap per-response API spend.
    AGENT_ANTHROPIC_MAX_TOKENS: "1024"
    AGENT_START_SERVER_REQUIRES_CONFIRMATION: "true"
    AGENT_STOP_SERVER_REQUIRES_CONFIRMATION: "true"
    AGENT_RESTART_SERVER_REQUIRES_CONFIRMATION: "true"
    AGENT_TRIGGER_BACKUP_REQUIRES_CONFIRMATION: "true"
    DIAGNOSTICS_WEBAPP_ENABLED: "false"
    DIAGNOSTICS_LOGS_ENABLED: "false"
    DIAGNOSTICS_LOGS_MAX_LINES: "500"
    DIAGNOSTICS_LOGS_ANONYMIZE: "true"

# ---------------------------------------------------------------------------
# Secrets – sensitive values stored in a k8s Secret
# rconPassword and adminPassword are required; install will fail if not set.
# Override via --set secrets.rconPassword=xxx or a separate values file.
# ---------------------------------------------------------------------------
secrets:
  rconPassword: ""
  adminUsername: "admin"
  adminPassword: ""
  # Protects the wrapper's POST /api/plugins/deploy and POST /api/world/upload. The webapp
  # receives the same value and presents it when forwarding a dashboard world upload, so
  # leaving it empty also disables world upload from the dashboard.
  deployAuthToken: ""
  # Protects the webapp's POST /api/deployment-history, which the wrapper calls back into.
  deploymentAuthToken: ""
  discordWebhookUrl: ""
  agentDiscordBotToken: ""
  agentDiscordChannelId: ""
  agentAnthropicApiKey: ""

# ---------------------------------------------------------------------------
# Security Contexts
# ---------------------------------------------------------------------------
# podSecurityContext is applied at the pod level (spec.securityContext) on
# every Deployment.  containerSecurityContext is applied to every container
# except nginx, which needs additional capabilities to bind to privileged
# ports and manage worker-process user switching.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop: [ALL]

# ---------------------------------------------------------------------------
# Network Policies
# ---------------------------------------------------------------------------
# When enabled, a NetworkPolicy is created for each service that restricts
# ingress and egress to the minimum required traffic.  Health-probe ports are
# opened to 0.0.0.0/0 because kubelet probes originate from the node's host
# network (outside the pod network) and cannot be matched by a podSelector.
# In most CNI implementations (Calico, Canal) host-network traffic is exempt
# from pod NetworkPolicies regardless, but the rule ensures probes work across
# all supported CNIs.
# Disable on clusters whose CNI does not support NetworkPolicy (e.g. Flannel
# without a policy controller).
networkPolicy:
  enabled: true
  # CIDR allowed to reach service probe ports for kubelet health checks.
  # Kubelet probes originate from the node's host network; set this to your
  # cluster's node CIDR for tighter control, or leave as 0.0.0.0/0 for broad
  # CNI compatibility (including CNIs that don't bypass NetworkPolicy for
  # host-network traffic).
  kubeNodeCIDR: "0.0.0.0/0"
  # Selectors for the cluster DNS service (CoreDNS/kube-dns).
  # Defaults work for kubeadm, GKE, EKS, LKE, and most standard distros.
  # Adjust if your cluster uses different labels (e.g. some distributions use
  # app: coredns instead of k8s-app: kube-dns).
  dnsNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: kube-system
  dnsPodSelector:
    matchLabels:
      k8s-app: kube-dns

# ---------------------------------------------------------------------------
# PodDisruptionBudgets
# ---------------------------------------------------------------------------
# When enabled, creates PDBs for minecraft-wrapper, webapp, and alert-manager
# with minAvailable: 1.  Disable if your cluster has a single node and drain
# operations would otherwise be blocked.
podDisruptionBudgets:
  enabled: true

# ---------------------------------------------------------------------------
# Monitoring
# ---------------------------------------------------------------------------
# When enabled, a ServiceMonitor is created for each service that exposes
# Spring Boot Actuator Prometheus metrics (/actuator/prometheus).
# Requires the Prometheus Operator (kube-prometheus-stack or standalone) to
# be installed in the cluster.
monitoring:
  enabled: false
  serviceMonitor:
    # Extra labels added to every ServiceMonitor. Use this to match your
    # Prometheus Operator's serviceMonitorSelector, e.g.:
    #   labels:
    #     release: kube-prometheus-stack
    labels: {}
    interval: "30s"
    scrapeTimeout: "10s"
  grafanaDashboard:
    # When true, a ConfigMap containing a sample Grafana dashboard JSON is
    # created. Import it in Grafana or let the Grafana sidecar pick it up.
    enabled: true
    # Extra labels added to the dashboard ConfigMap. Use this to target the
    # Grafana sidecar, e.g.:
    #   labels:
    #     grafana_dashboard: "1"
    labels: {}
  # Namespace where Prometheus is deployed. Used by NetworkPolicies to allow
  # cross-namespace scrape traffic when monitoring.enabled is true.
  # Override if you deploy kube-prometheus-stack in a non-default namespace.
  prometheusNamespace: monitoring

# ---------------------------------------------------------------------------
# Persistence
# ---------------------------------------------------------------------------
persistence:
  # Leave storageClass empty to use the cluster default StorageClass.
  # Override with a provider-specific value (for example via a custom values
  # file or --set) when required by your environment (e.g., "gp2" on AWS,
  # "standard" on minikube, "linode-block-storage-retain" on Linode).
  mcserver:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
  webappData:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
  alertManagerData:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
  backups:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 20Gi
