suite: RBAC
templates:
  - templates/rbac.yaml
set:
  secrets.rconPassword: ci
  secrets.adminPassword: ci
tests:
  - it: renders nothing by default
    # A chart should not mint credentials nobody asked for.
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when the rbac key is absent (backward compat)
    set:
      rbac: null
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the viewer trio when enabled
    set:
      rbac.enabled: true
    asserts:
      - hasDocuments:
          count: 3

  - it: renders both trios when the operator is also enabled
    set:
      rbac.enabled: true
      rbac.operator.enabled: true
    asserts:
      - hasDocuments:
          count: 6

  - it: does not render the operator without rbac.enabled
    # rbac.enabled gates the whole file, so operator.enabled alone must not
    # produce a ServiceAccount that nothing binds.
    set:
      rbac.operator.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: names objects after the release
    set:
      rbac.enabled: true
    documentIndex: 0
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-omcsi-viewer

  - it: binds the viewer subject in the release namespace
    # If this ends up pointing at another namespace the credential silently does
    # nothing -- it authenticates and is then authorised for no rules at all.
    set:
      rbac.enabled: true
    documentIndex: 2
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: subjects[0].namespace
          value: NAMESPACE
      - equal:
          path: subjects[0].name
          value: RELEASE-NAME-omcsi-viewer
      - equal:
          path: roleRef.name
          value: RELEASE-NAME-omcsi-viewer

  - it: the viewer cannot read secrets
    # The property that makes this role safe to hand out. If secrets ever appear
    # in these rules, the role stops being a viewer.
    set:
      rbac.enabled: true
    documentIndex: 1
    asserts:
      - isKind:
          of: Role
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [get, list, watch]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods/log]
            verbs: [get, list]

  - it: the viewer cannot exec into containers
    set:
      rbac.enabled: true
    documentIndex: 1
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods/exec]
            verbs: [create]

  - it: the operator can exec and read secrets, which is why it is separate
    set:
      rbac.enabled: true
      rbac.operator.enabled: true
    documentIndex: 4
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.name
          value: RELEASE-NAME-omcsi-operator
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods/exec]
            verbs: [create]

  - it: every rule is namespaced, never cluster-scoped
    # A ClusterRole here would defeat the entire point of the change.
    set:
      rbac.enabled: true
      rbac.operator.enabled: true
    asserts:
      - notFailedTemplate: {}

  # ---------------------------------------------------------------------------
  # The dashboard's own ServiceAccount (webapp.sleepAware.enabled). Gated on
  # its own, not on rbac.enabled: one is for a pod, the other for people.
  # ---------------------------------------------------------------------------
  - it: renders the webapp trio when sleep-aware, without rbac.enabled
    set:
      webapp.sleepAware.enabled: true
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: ServiceAccount
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-omcsi-webapp
        documentIndex: 0
      - isKind:
          of: Role
        documentIndex: 1
      - isKind:
          of: RoleBinding
        documentIndex: 2

  - it: renders both the viewer and the webapp trios when both are enabled
    set:
      rbac.enabled: true
      webapp.sleepAware.enabled: true
    asserts:
      - hasDocuments:
          count: 6
      - equal:
          path: metadata.name
          value: RELEASE-NAME-omcsi-webapp
        documentIndex: 3

  - it: the webapp Role is pinned to the wrapper StatefulSet by name
    # get on the StatefulSet, get/patch on its scale subresource, and nothing
    # else: a compromised dashboard can scale this release's wrapper, not the
    # namespace.
    set:
      webapp.sleepAware.enabled: true
    documentIndex: 1
    asserts:
      - lengthEqual:
          path: rules
          count: 2
      - contains:
          path: rules
          content:
            apiGroups: [apps]
            resources: [statefulsets]
            resourceNames: [RELEASE-NAME-omcsi-minecraft-wrapper]
            verbs: [get]
      - contains:
          path: rules
          content:
            apiGroups: [apps]
            resources: [statefulsets/scale]
            resourceNames: [RELEASE-NAME-omcsi-minecraft-wrapper]
            verbs: [get, patch]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [get, list, watch]

  - it: binds the webapp ServiceAccount in the release namespace
    set:
      webapp.sleepAware.enabled: true
    documentIndex: 2
    asserts:
      - equal:
          path: roleRef.name
          value: RELEASE-NAME-omcsi-webapp
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
      - equal:
          path: subjects[0].name
          value: RELEASE-NAME-omcsi-webapp
      - equal:
          path: subjects[0].namespace
          value: NAMESPACE
