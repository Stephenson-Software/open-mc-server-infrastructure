suite: nginx
# nginx.yaml references nginx-configmap.yaml (checksum annotation), so both
# templates must be rendered together. Service assertions use documentSelector
# to target the Service by kind, independent of document order.
templates:
  - templates/nginx.yaml
  - templates/nginx-configmap.yaml
set:
  secrets.rconPassword: ci
  secrets.adminPassword: ci
tests:
  - it: service is a LoadBalancer exposing HTTP and HTTPS by default
    documentSelector:
      path: kind
      value: Service
      skipEmptyTemplates: true
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[1].port
          value: 443

  - it: service has no fixed nodePorts by default
    documentSelector:
      path: kind
      value: Service
      skipEmptyTemplates: true
    asserts:
      - notExists:
          path: spec.ports[0].nodePort
      - notExists:
          path: spec.ports[1].nodePort

  - it: nodePorts are pinned when set on a NodePort service
    set:
      nginx.service.type: NodePort
      nginx.service.httpNodePort: 80
      nginx.service.httpsNodePort: 443
    documentSelector:
      path: kind
      value: Service
      skipEmptyTemplates: true
    asserts:
      - equal:
          path: spec.type
          value: NodePort
      - equal:
          path: spec.ports[0].nodePort
          value: 80
      - equal:
          path: spec.ports[1].nodePort
          value: 443

  - it: config map caps request bodies at the default upload size limit
    documentSelector:
      path: kind
      value: ConfigMap
      skipEmptyTemplates: true
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "client_max_body_size 100M;"

  - it: upload size limit is configurable via nginx.maxBodySize
    set:
      nginx.maxBodySize: 2G
    documentSelector:
      path: kind
      value: ConfigMap
      skipEmptyTemplates: true
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "client_max_body_size 2G;"
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: "client_max_body_size 100M;"

  - it: nodePorts are ignored for non-NodePort service types
    set:
      nginx.service.type: LoadBalancer
      nginx.service.httpNodePort: 80
      nginx.service.httpsNodePort: 443
    documentSelector:
      path: kind
      value: Service
      skipEmptyTemplates: true
    asserts:
      - notExists:
          path: spec.ports[0].nodePort
      - notExists:
          path: spec.ports[1].nodePort

  - it: world routes are proxied to the webapp with request buffering off
    documentSelector:
      path: kind
      value: ConfigMap
      skipEmptyTemplates: true
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "location /api/world/ \\{"
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "proxy_request_buffering off;"

  - it: upload routes get the upload timeout while the dashboard keeps 60s
    documentSelector:
      path: kind
      value: ConfigMap
      skipEmptyTemplates: true
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "proxy_send_timeout    3600s;"
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "proxy_read_timeout    60s;"

  - it: upload timeout is configurable via nginx.uploadTimeout
    set:
      nginx.uploadTimeout: 7200s
    documentSelector:
      path: kind
      value: ConfigMap
      skipEmptyTemplates: true
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "proxy_read_timeout    7200s;"
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: "proxy_read_timeout    3600s;"

  # The NetworkPolicy already permits nginx -> wrapper:8100, so the proxy route is
  # the only missing piece. It stays opt-in: nothing listens on that port until the
  # BlueMap plugin is installed.
  - it: does not route BlueMap by default
    documentSelector:
      path: kind
      value: ConfigMap
      skipEmptyTemplates: true
    asserts:
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: "location /map/"

  - it: routes BlueMap to the wrapper when enabled
    set:
      nginx.bluemap.enabled: true
    documentSelector:
      path: kind
      value: ConfigMap
      skipEmptyTemplates: true
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "location /map/ \\{"
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "proxy_pass http://RELEASE-NAME-omcsi-minecraft-wrapper-internal:8100/;"

  - it: honours a custom BlueMap path
    set:
      nginx.bluemap.enabled: true
      nginx.bluemap.path: /bluemap/
    documentSelector:
      path: kind
      value: ConfigMap
      skipEmptyTemplates: true
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "location /bluemap/ \\{"

  - it: port 80 redirects to HTTPS when no Ingress is in front
    template: templates/nginx-configmap.yaml
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'listen 80;[\s\S]*?return 301 https://\$host\$request_uri;'

  - it: port 80 serves the dashboard when an Ingress terminates TLS in front (no redirect loop)
    template: templates/nginx-configmap.yaml
    set:
      ingress.enabled: true
      ingress.hosts:
        - host: oak.example.com
    asserts:
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'return 301'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'listen 80;[\s\S]*?location /api/world/ \{[\s\S]*?listen 443 ssl;'

  - it: forwards the controller's https scheme to the web app instead of nginx's own
    template: templates/nginx-configmap.yaml
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'map \$http_x_forwarded_proto \$omcsi_forwarded_proto'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_set_header X-Forwarded-Proto \$omcsi_forwarded_proto;'
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'X-Forwarded-Proto \$scheme;'

  - it: routes only the CI deploy endpoint to the wrapper; the dashboard's plugin list/upload/delete reach the web app
    template: templates/nginx-configmap.yaml
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location = /api/plugins/deploy \{\s+proxy_pass http://RELEASE-NAME-omcsi-minecraft-wrapper-internal:8092;'
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'location /api/plugins/ \{'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location /api/plugins/upload \{\s+proxy_pass http://RELEASE-NAME-omcsi-webapp:8080;'

  # nginx.tls.selfSigned selects one of two certificate sources, and both must end
  # up as cert.pem / key.pem under /etc/nginx/ssl, the paths nginx.conf reads.
  - it: self-signed TLS is the default and generates the certificate in an init container
    documentSelector:
      path: kind
      value: Deployment
      skipEmptyTemplates: true
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 1
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: generate-tls
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'openssl req -x509 -nodes -days 365 -newkey rsa:2048'
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: '-keyout /etc/nginx/ssl/key\.pem'
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: '-out /etc/nginx/ssl/cert\.pem'

  - it: self-signed init container keeps a certificate that already exists
    documentSelector:
      path: kind
      value: Deployment
      skipEmptyTemplates: true
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'if \[ ! -f /etc/nginx/ssl/cert\.pem \] \|\| \[ ! -f /etc/nginx/ssl/key\.pem \]; then'

  - it: self-signed init container runs from the nginx image
    set:
      nginx.image.repository: registry.example.com/nginx
      nginx.image.tag: "1.2.3"
    documentSelector:
      path: kind
      value: Deployment
      skipEmptyTemplates: true
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: registry.example.com/nginx:1.2.3
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/nginx:1.2.3

  # containerSecurityContext makes the root filesystem read-only, so HOME points at
  # the /tmp emptyDir, which is writable.
  - it: self-signed init container gets a writable HOME on the root-read-only filesystem
    documentSelector:
      path: kind
      value: Deployment
      skipEmptyTemplates: true
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: HOME
            value: /tmp
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: nginx-tmp
            mountPath: /tmp

  # The exact-match `contains` on the nginx container's mount is what proves it is
  # not read-only here: a readOnly key would make the entry unequal.
  - it: self-signed certificates live in an emptyDir shared by the init container and nginx
    documentSelector:
      path: kind
      value: Deployment
      skipEmptyTemplates: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls
            emptyDir: {}
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: tls
            mountPath: /etc/nginx/ssl
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tls
            mountPath: /etc/nginx/ssl

  - it: supplied TLS renders no init container
    set:
      nginx.tls.selfSigned: false
    documentSelector:
      path: kind
      value: Deployment
      skipEmptyTemplates: true
    asserts:
      - notExists:
          path: spec.template.spec.initContainers

  - it: supplied TLS maps the Secret's keys to the file names nginx reads
    set:
      nginx.tls.selfSigned: false
    documentSelector:
      path: kind
      value: Deployment
      skipEmptyTemplates: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls
            secret:
              secretName: RELEASE-NAME-omcsi-nginx-tls
              items:
                - key: tls.crt
                  path: cert.pem
                - key: tls.key
                  path: key.pem
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: tls
            emptyDir: {}

  # values.yaml documents both forms of the Secret name operators must create.
  - it: supplied TLS Secret drops the chart name when the release name already contains it
    release:
      name: omcsi-prod
    set:
      nginx.tls.selfSigned: false
    documentSelector:
      path: kind
      value: Deployment
      skipEmptyTemplates: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls
            secret:
              secretName: omcsi-prod-nginx-tls
              items:
                - key: tls.crt
                  path: cert.pem
                - key: tls.key
                  path: key.pem

  - it: supplied TLS mounts the Secret read-only into nginx
    set:
      nginx.tls.selfSigned: false
    documentSelector:
      path: kind
      value: Deployment
      skipEmptyTemplates: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tls
            mountPath: /etc/nginx/ssl
            readOnly: true

  - it: nginx serves HTTPS from the certificate paths both TLS modes populate
    template: templates/nginx-configmap.yaml
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'listen 443 ssl;[\s\S]*?ssl_certificate\s+/etc/nginx/ssl/cert\.pem;'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'ssl_certificate_key\s+/etc/nginx/ssl/key\.pem;'
