suite: nginx
# nginx.yaml references nginx-configmap.yaml (checksum annotation), so both
# templates must be rendered together. Service assertions use documentSelector
# to target the Service by kind, independent of document order.
templates:
  - templates/nginx.yaml
  - templates/nginx-configmap.yaml
set:
  secrets.rconPassword: ci
  secrets.adminPassword: ci
tests:
  - it: service is a LoadBalancer exposing HTTP and HTTPS by default
    documentSelector:
      path: kind
      value: Service
      skipEmptyTemplates: true
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[1].port
          value: 443

  - it: service has no fixed nodePorts by default
    documentSelector:
      path: kind
      value: Service
      skipEmptyTemplates: true
    asserts:
      - notExists:
          path: spec.ports[0].nodePort
      - notExists:
          path: spec.ports[1].nodePort

  - it: nodePorts are pinned when set on a NodePort service
    set:
      nginx.service.type: NodePort
      nginx.service.httpNodePort: 80
      nginx.service.httpsNodePort: 443
    documentSelector:
      path: kind
      value: Service
      skipEmptyTemplates: true
    asserts:
      - equal:
          path: spec.type
          value: NodePort
      - equal:
          path: spec.ports[0].nodePort
          value: 80
      - equal:
          path: spec.ports[1].nodePort
          value: 443

  - it: config map caps request bodies at the default upload size limit
    documentSelector:
      path: kind
      value: ConfigMap
      skipEmptyTemplates: true
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "client_max_body_size 100M;"

  - it: upload size limit is configurable via nginx.maxBodySize
    set:
      nginx.maxBodySize: 2G
    documentSelector:
      path: kind
      value: ConfigMap
      skipEmptyTemplates: true
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "client_max_body_size 2G;"
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: "client_max_body_size 100M;"

  - it: nodePorts are ignored for non-NodePort service types
    set:
      nginx.service.type: LoadBalancer
      nginx.service.httpNodePort: 80
      nginx.service.httpsNodePort: 443
    documentSelector:
      path: kind
      value: Service
      skipEmptyTemplates: true
    asserts:
      - notExists:
          path: spec.ports[0].nodePort
      - notExists:
          path: spec.ports[1].nodePort

  - it: world routes are proxied to the webapp with request buffering off
    documentSelector:
      path: kind
      value: ConfigMap
      skipEmptyTemplates: true
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "location /api/world/ \\{"
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "proxy_request_buffering off;"

  - it: upload routes get the upload timeout while the dashboard keeps 60s
    documentSelector:
      path: kind
      value: ConfigMap
      skipEmptyTemplates: true
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "proxy_send_timeout    3600s;"
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "proxy_read_timeout    60s;"

  - it: upload timeout is configurable via nginx.uploadTimeout
    set:
      nginx.uploadTimeout: 7200s
    documentSelector:
      path: kind
      value: ConfigMap
      skipEmptyTemplates: true
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "proxy_read_timeout    7200s;"
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: "proxy_read_timeout    3600s;"
