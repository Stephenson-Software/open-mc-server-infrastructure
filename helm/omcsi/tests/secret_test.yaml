suite: secret
templates:
  - templates/secret.yaml
set:
  secrets.rconPassword: ci-rcon
  secrets.adminPassword: ci-admin
tests:
  - it: renders one Opaque Secret named by the omcsi.secretName helper
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-omcsi-secrets
      - equal:
          path: type
          value: Opaque

  - it: carries the required credentials and the default admin username
    asserts:
      - equal:
          path: stringData.RCON_PASSWORD
          value: ci-rcon
      - equal:
          path: stringData.ADMIN_PASSWORD
          value: ci-admin
      - equal:
          path: stringData.ADMIN_USERNAME
          value: admin

  - it: renders every optional credential as an empty string by default
    asserts:
      - equal:
          path: stringData.DEPLOY_AUTH_TOKEN
          value: ""
      - equal:
          path: stringData.DEPLOYMENT_AUTH_TOKEN
          value: ""
      - equal:
          path: stringData.DISCORD_WEBHOOK_URL
          value: ""
      - equal:
          path: stringData.AGENT_DISCORD_BOT_TOKEN
          value: ""
      - equal:
          path: stringData.AGENT_DISCORD_CHANNEL_ID
          value: ""
      - equal:
          path: stringData.AGENT_ANTHROPIC_API_KEY
          value: ""

  - it: passes optional credentials through when set
    set:
      secrets.adminUsername: operator
      secrets.deployAuthToken: ci-deploy
      secrets.deploymentAuthToken: ci-deployment
      secrets.discordWebhookUrl: https://discord.example/webhook
    asserts:
      - equal:
          path: stringData.ADMIN_USERNAME
          value: operator
      - equal:
          path: stringData.DEPLOY_AUTH_TOKEN
          value: ci-deploy
      - equal:
          path: stringData.DEPLOYMENT_AUTH_TOKEN
          value: ci-deployment
      - equal:
          path: stringData.DISCORD_WEBHOOK_URL
          value: https://discord.example/webhook

  - it: refuses to render without an RCON password
    set:
      secrets.rconPassword: ""
    asserts:
      - failedTemplate:
          errorMessage: secrets.rconPassword is required

  - it: refuses to render without an admin password
    set:
      secrets.adminPassword: ""
    asserts:
      - failedTemplate:
          errorMessage: secrets.adminPassword is required

  - it: passes agent credentials through when agent-manager is disabled
    set:
      secrets.agentDiscordBotToken: ci-token
    asserts:
      - equal:
          path: stringData.AGENT_DISCORD_BOT_TOKEN
          value: ci-token

  - it: passes agent credentials through when agent-manager is enabled and all are set
    set:
      agentManager.enabled: true
      secrets.agentDiscordBotToken: ci-token
      secrets.agentDiscordChannelId: "123456"
      secrets.agentAnthropicApiKey: ci-key
    asserts:
      - equal:
          path: stringData.AGENT_DISCORD_BOT_TOKEN
          value: ci-token
      - equal:
          path: stringData.AGENT_DISCORD_CHANNEL_ID
          value: "123456"
      - equal:
          path: stringData.AGENT_ANTHROPIC_API_KEY
          value: ci-key

  - it: requires the Discord bot token when agent-manager is enabled
    set:
      agentManager.enabled: true
      secrets.agentDiscordChannelId: "123456"
      secrets.agentAnthropicApiKey: ci-key
    asserts:
      - failedTemplate:
          errorMessage: secrets.agentDiscordBotToken is required when agentManager is enabled

  - it: requires the Discord channel ID when agent-manager is enabled
    set:
      agentManager.enabled: true
      secrets.agentDiscordBotToken: ci-token
      secrets.agentAnthropicApiKey: ci-key
    asserts:
      - failedTemplate:
          errorMessage: secrets.agentDiscordChannelId is required when agentManager is enabled

  - it: requires the Anthropic API key when agent-manager is enabled
    set:
      agentManager.enabled: true
      secrets.agentDiscordBotToken: ci-token
      secrets.agentDiscordChannelId: "123456"
    asserts:
      - failedTemplate:
          errorMessage: secrets.agentAnthropicApiKey is required when agentManager is enabled
