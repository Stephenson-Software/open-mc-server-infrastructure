suite: co-located values profile (values-colocated.yaml)
templates:
  - templates/minecraft-wrapper.yaml
  - templates/webapp.yaml
  - templates/nginx.yaml
  - templates/nginx-configmap.yaml
  - templates/alert-manager.yaml
  - templates/backup-manager.yaml
  - templates/ingress.yaml
  - templates/pdb.yaml
  - templates/pvc.yaml
  - templates/rbac.yaml
  - templates/networkpolicies.yaml
values:
  - ../values-colocated.yaml
set:
  secrets.rconPassword: ci
  secrets.adminPassword: ci
  ingress.hosts:
    - host: oak.example.com
  minecraftWrapper.service.annotations:
    mc-router.itzg.me/externalServerName: oak.example.com
tests:
  - it: wrapper is born asleep with the profile's sizing and heap
    template: templates/minecraft-wrapper.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 0
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 3.5Gi
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: JAVA_OPTS
            value: "-Xms1G -Xmx3G"
        documentIndex: 0

  - it: game Service is ClusterIP and carries the router annotation
    template: templates/minecraft-wrapper.yaml
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
        documentIndex: 1
      - equal:
          path: metadata.annotations["mc-router.itzg.me/externalServerName"]
          value: oak.example.com
        documentIndex: 1

  - it: webapp JVM is capped to fit its limit
    template: templates/webapp.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 320Mi
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: JAVA_TOOL_OPTIONS
            value: "-Xmx160m -XX:+UseSerialGC"
        documentIndex: 0

  - it: dashboard does not wait for the sleeping wrapper
    # The profile's wrapper starts at 0 replicas, so an init container polling
    # its health would hold the dashboard at Init and `helm --wait` would never
    # return; the profile turns sleep-aware mode on to drop it.
    template: templates/webapp.yaml
    asserts:
      - isNull:
          path: spec.template.spec.initContainers
        documentIndex: 0
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-omcsi-webapp
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SLEEP_AWARE_ENABLED
            value: "true"
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WRAPPER_STATEFULSET_NAME
            value: RELEASE-NAME-omcsi-minecraft-wrapper
        documentIndex: 0

  - it: dashboard gets a ServiceAccount that can scale the wrapper and nothing else
    template: templates/rbac.yaml
    asserts:
      - hasDocuments:
          count: 3
      - contains:
          path: rules
          content:
            apiGroups: [apps]
            resources: [statefulsets/scale]
            resourceNames: [RELEASE-NAME-omcsi-minecraft-wrapper]
            verbs: [get, patch]
        documentIndex: 1

  - it: dashboard may reach the Kubernetes API
    template: templates/networkpolicies.yaml
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 443
                protocol: TCP
              - port: 6443
                protocol: TCP
            to:
              - ipBlock:
                  cidr: 0.0.0.0/0
        documentIndex: 1

  - it: nginx claims no address of its own
    template: templates/nginx.yaml
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
        documentIndex: 1

  - it: leaves out alert-manager and backup-manager
    templates: [templates/alert-manager.yaml, templates/backup-manager.yaml]
    asserts:
      - hasDocuments:
          count: 0

  - it: routes the dashboard by hostname
    template: templates/ingress.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.rules[0].host
          value: oak.example.com

  - it: renders no PodDisruptionBudgets on a single node
    template: templates/pdb.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: keeps only the world and dashboard volumes, at the profile's world size
    template: templates/pvc.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.resources.requests.storage
          value: 5Gi
        documentIndex: 0
