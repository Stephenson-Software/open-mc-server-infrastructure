suite: webapp
templates:
  - templates/webapp.yaml
set:
  secrets.rconPassword: ci
  secrets.adminPassword: ci
tests:
  - it: Deployment is the first document
    asserts:
      - isKind:
          of: Deployment
        documentIndex: 0

  - it: has an init container named wait-for-wrapper
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-wrapper
        documentIndex: 0

  - it: init container uses busybox 1.36
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: busybox:1.36
        documentIndex: 0

  - it: init container polls the minecraft-wrapper internal health endpoint
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "minecraft-wrapper-internal.*actuator/health"
        documentIndex: 0

  - it: init container wget uses a connect/read timeout
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "wget -T"
        documentIndex: 0

  - it: init container exits non-zero after max attempts
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "exit 1"
        documentIndex: 0

  - it: mounts mcserver and webapp-data volumes
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: mcserver
            mountPath: /mcserver
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: webapp-data
            mountPath: /app/data
        documentIndex: 0

  - it: uses PVC for webapp-data when persistence is enabled
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: RELEASE-NAME-omcsi-webapp-data
        documentIndex: 0

  - it: uses emptyDir for webapp-data when persistence is disabled
    set:
      persistence.webappData.enabled: false
    asserts:
      - isNotNull:
          path: spec.template.spec.volumes[0].emptyDir
        documentIndex: 0
      - isNull:
          path: spec.template.spec.volumes[0].persistentVolumeClaim
        documentIndex: 0

  - it: service is ClusterIP on port 8080
    asserts:
      - isKind:
          of: Service
        documentIndex: 1
      - equal:
          path: spec.type
          value: ClusterIP
        documentIndex: 1
      - equal:
          path: spec.ports[0].port
          value: 8080
        documentIndex: 1

  - it: readiness probe checks root path on http port
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: http
        documentIndex: 0

  - it: renders the Spring multipart upload limits
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MAX_FILE_UPLOAD_SIZE
            value: "2048MB"
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MAX_REQUEST_UPLOAD_SIZE
            value: "2048MB"
        documentIndex: 0

  - it: upload limits are configurable
    set:
      webapp.env.MAX_FILE_UPLOAD_SIZE: 512MB
      webapp.env.MAX_REQUEST_UPLOAD_SIZE: 512MB
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MAX_FILE_UPLOAD_SIZE
            value: "512MB"
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MAX_REQUEST_UPLOAD_SIZE
            value: "512MB"
        documentIndex: 0

  # The webapp POSTs to ALERT_MANAGER_URL verbatim, exactly like minecraft-wrapper,
  # backup-manager and agent-manager, so the /api/alerts path must be part of the value.
  - it: renders ALERT_MANAGER_URL as the full alerts endpoint
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ALERT_MANAGER_URL
            value: http://RELEASE-NAME-omcsi-alert-manager:8090/api/alerts
        documentIndex: 0

  # Without this the dashboard cannot authenticate to the wrapper's world upload
  # endpoint and every upload is rejected as "not configured on this server".
  - it: renders DEPLOY_AUTH_TOKEN from the chart secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEPLOY_AUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-omcsi-secrets
                key: DEPLOY_AUTH_TOKEN
        documentIndex: 0

  - it: still renders DEPLOYMENT_AUTH_TOKEN alongside it
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEPLOYMENT_AUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-omcsi-secrets
                key: DEPLOYMENT_AUTH_TOKEN
        documentIndex: 0

  - it: renders the world upload forward timeout, raisable for large worlds
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WORLD_UPLOAD_READ_TIMEOUT_SECONDS
            value: "600"
        documentIndex: 0

  - it: honours a raised world upload forward timeout
    set:
      webapp.env.WORLD_UPLOAD_READ_TIMEOUT_SECONDS: "3600"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WORLD_UPLOAD_READ_TIMEOUT_SECONDS
            value: "3600"
        documentIndex: 0

  # ---------------------------------------------------------------------------
  # Sleep-aware mode (webapp.sleepAware.enabled). Off by default: the init
  # container stays, no ServiceAccount token is mounted, no extra env.
  # ---------------------------------------------------------------------------
  - it: does not mount a ServiceAccount token by default
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        documentIndex: 0
      - isNull:
          path: spec.template.spec.serviceAccountName
        documentIndex: 0

  - it: renders no sleep-aware env by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SLEEP_AWARE_ENABLED
            value: "true"
        documentIndex: 0
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: WRAPPER_STATEFULSET_NAME
            value: RELEASE-NAME-omcsi-minecraft-wrapper
        documentIndex: 0

  - it: omits the wait-for-wrapper init container when sleep-aware
    # A wrapper resting at 0 replicas never becomes healthy, so waiting for it
    # would hold the dashboard (and nginx behind it) at Init forever.
    set:
      webapp.sleepAware.enabled: true
    asserts:
      - isNull:
          path: spec.template.spec.initContainers
        documentIndex: 0

  - it: runs as its own ServiceAccount with the token mounted when sleep-aware
    set:
      webapp.sleepAware.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-omcsi-webapp
        documentIndex: 0
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
        documentIndex: 0

  - it: tells the dashboard which StatefulSet to watch when sleep-aware
    set:
      webapp.sleepAware.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SLEEP_AWARE_ENABLED
            value: "true"
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WRAPPER_STATEFULSET_NAME
            value: RELEASE-NAME-omcsi-minecraft-wrapper
        documentIndex: 0

  - it: readiness never depends on the wrapper when sleep-aware
    # The probe hits the dashboard's own root, which redirects without touching
    # the wrapper, so a sleeping wrapper cannot keep the dashboard unready.
    set:
      webapp.sleepAware.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /
        documentIndex: 0
