name: Build and Publish Docker Images

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'minecraft-wrapper/**'
      - 'resources/**'
      - 'web-app/**'
      - 'nginx/**'
      - 'alert-manager/**'
      - 'backup-manager/**'
      - 'agent-manager/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: 'Minecraft version to build (e.g. 26.2)'
        required: false
        default: '26.2'
      push_images:
        description: 'Push images to Docker Hub'
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

jobs:
  build-open-mc-server:
    name: Build open-mc-server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Minecraft version
        id: mc_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            raw_version="${{ github.event.inputs.minecraft_version }}"
            # Allow only digits, dots, and hyphens (e.g. "26.2", "1.21.4", "1.21-pre1")
            if ! echo "${raw_version}" | grep -qE '^[0-9][0-9a-zA-Z.-]*$'; then
              echo "::error::Invalid minecraft_version input: '${raw_version}'. Only alphanumeric characters, dots, and hyphens are allowed."
              exit 1
            fi
            version="${raw_version}"
          else
            # Extract default from Dockerfile ARG
            version=$(grep 'ARG MINECRAFT_VERSION=' Dockerfile | head -1 | cut -d= -f2)
          fi
          # Version is validated above; simple assignment is safe here
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # QEMU enables cross-building the arm64 image on the amd64 runner so the
      # published manifest serves ARM hosts (e.g. Hetzner CAX, Oracle Ampere).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Booting the docker-container driver pulls the BuildKit image from Docker
      # Hub, and that pull has no retry of its own — a transient registry timeout
      # fails the job before any build starts. Pre-pull it with backoff so the
      # bootstrap below finds it locally. Keep this tag in sync with the
      # driver-opts image pin on the next step.
      - name: Pre-pull BuildKit image
        run: |
          for attempt in 1 2 3; do
            if docker pull moby/buildkit:buildx-stable-1; then
              exit 0
            fi
            echo "::warning::BuildKit image pull failed (attempt ${attempt}/3); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::Could not pull moby/buildkit:buildx-stable-1 after 3 attempts"
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Log in to Docker Hub
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push open-mc-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # Multi-arch manifest so the image runs on both x86 and ARM hosts.
          platforms: linux/amd64,linux/arm64
          build-args: MINECRAFT_VERSION=${{ steps.mc_version.outputs.version }}
          push: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true' }}
          # The version tag pins the Minecraft version; the commit SHA pins the
          # build. Two images can carry the same Minecraft version and differ in
          # the wrapper, the entrypoint, or the base image, so the version tag
          # alone is not enough to reproduce a deployment exactly.
          tags: |
            dmccoystephenson/open-mc-server:latest
            dmccoystephenson/open-mc-server:${{ steps.mc_version.outputs.version }}
            dmccoystephenson/open-mc-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # BuildTools downloads Spigot source and compiles it — this takes ~20 minutes
          # on amd64. The arm64 leg builds under QEMU emulation and is significantly
          # slower; for faster builds, run this job on a native arm64 runner and drop
          # QEMU. The GHA cache significantly reduces rebuild time on subsequent runs.

  build-supporting-images:
    name: Build supporting images
    runs-on: ubuntu-latest
    strategy:
      # Each image is published independently, so one image's failure must not
      # cancel the others mid-build and leave the registry half-updated.
      fail-fast: false
      matrix:
        include:
          - name: open-mc-server-webapp
            context: web-app
            dockerfile: web-app/Dockerfile
          - name: open-mc-server-nginx
            context: nginx
            dockerfile: nginx/Dockerfile
          - name: open-mc-server-alert-manager
            context: alert-manager
            dockerfile: alert-manager/Dockerfile
          - name: open-mc-server-backup-manager
            context: backup-manager
            dockerfile: backup-manager/Dockerfile
          - name: open-mc-server-agent-manager
            context: agent-manager
            dockerfile: agent-manager/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # QEMU enables cross-building the arm64 images on the amd64 runner so the
      # published manifests serve ARM hosts (e.g. Hetzner CAX, Oracle Ampere).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # See the note on the open-mc-server job: the BuildKit bootstrap pull is
      # not retried by the action, so pre-pull it with backoff.
      - name: Pre-pull BuildKit image
        run: |
          for attempt in 1 2 3; do
            if docker pull moby/buildkit:buildx-stable-1; then
              exit 0
            fi
            echo "::warning::BuildKit image pull failed (attempt ${attempt}/3); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::Could not pull moby/buildkit:buildx-stable-1 after 3 attempts"
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Log in to Docker Hub
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Multi-arch manifest so the image runs on both x86 and ARM hosts.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true' }}
          # `latest` is kept so nothing that depends on it breaks, and the
          # commit SHA is added so a deployment can name an exact build. Without
          # a second tag these images are unpinnable: `latest` moves whenever
          # this workflow runs, and a pod rescheduled for any unrelated reason
          # comes back on different code than it went down with.
          tags: |
            dmccoystephenson/${{ matrix.name }}:latest
            dmccoystephenson/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
