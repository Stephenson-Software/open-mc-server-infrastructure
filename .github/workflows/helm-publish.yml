name: Publish Helm Chart

on:
  push:
    branches: [ main ]
    paths:
      - 'helm/omcsi/Chart.yaml'
      - '.github/workflows/helm-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Package and publish to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.17.0'

      - name: Lint chart
        run: helm lint helm/omcsi --set secrets.rconPassword=x --set secrets.adminPassword=x

      - name: Package chart
        id: package
        run: |
          helm package helm/omcsi --destination /tmp/helm-package
          version=$(grep '^version:' helm/omcsi/Chart.yaml | awk '{print $2}')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "path=/tmp/helm-package/omcsi-${version}.tgz" >> "$GITHUB_OUTPUT"

      # GHCR rejects repository paths containing uppercase characters, and the
      # owner (Stephenson-Software) has some, so lowercase it before use.
      - name: Compute registry owner
        id: owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "lower=${OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Push chart to GHCR
        run: helm push "${{ steps.package.outputs.path }}" oci://ghcr.io/${{ steps.owner.outputs.lower }}/charts
