name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    name: Validate Code and Configuration
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck
        
    - name: Validate shell scripts
      run: |
        echo "🔍 Validating shell script syntax..."
        bash -n up.sh
        bash -n down.sh
        bash -n upgrade.sh
        bash -n rollback.sh
        bash -n trigger-backup.sh
        bash -n resources/post-create.sh

        echo "🔍 Running ShellCheck linter..."
        shellcheck up.sh down.sh upgrade.sh rollback.sh trigger-backup.sh resources/post-create.sh scripts/*.sh
        
    - name: Validate Docker configuration
      run: |
        echo "🐳 Validating Dockerfile..."
        test -f Dockerfile
        grep -q "FROM" Dockerfile
        
        echo "🐳 Validating Docker Compose configuration..."
        cp sample.env .env
        sed -i 's/YOUR_UUID_HERE/test-uuid-1234/g' .env
        sed -i 's/YOUR_USERNAME_HERE/TestPlayer/g' .env
        docker compose config > /dev/null
        rm .env
        
        echo "🐳 Testing Docker build..."
        docker build --target base -t minecraft-server-test .
        
    - name: Validate environment configuration
      run: |
        echo "⚙️ Validating sample.env format..."
        test -f sample.env
        grep -q "MINECRAFT_VERSION=" sample.env
        grep -q "OPERATOR_UUID=" sample.env
        grep -q "OPERATOR_NAME=" sample.env
        grep -q "SERVER_MOTD=" sample.env
        
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        
    - name: Build web application
      run: |
        echo "🌐 Building web application..."
        cd web-app
        ./gradlew build
        echo "✓ Web application built successfully"
        ls -lh build/libs/
        
    - name: Run web application tests
      run: |
        echo "🧪 Running web application tests..."
        cd web-app
        ./gradlew test
        echo "✓ All tests passed"
        
    - name: Build minecraft-wrapper module
      run: |
        echo "🎮 Building minecraft-wrapper module..."
        cd minecraft-wrapper
        ./gradlew build
        echo "✓ Minecraft wrapper built successfully"
        ls -lh build/libs/
        
    - name: Run minecraft-wrapper tests
      run: |
        echo "🧪 Running minecraft-wrapper tests..."
        cd minecraft-wrapper
        ./gradlew test
        echo "✓ All tests passed"
        
    - name: Build agent-manager module
      run: |
        echo "🤖 Building agent-manager module..."
        cd agent-manager
        ./gradlew build
        echo "✓ Agent manager built successfully"
        ls -lh build/libs/
        
    - name: Run agent-manager tests
      run: |
        echo "🧪 Running agent-manager tests..."
        cd agent-manager
        ./gradlew test
        echo "✓ All tests passed"
        
    - name: Build alert-manager module
      run: |
        echo "🔔 Building alert-manager module..."
        cd alert-manager
        ./gradlew build
        echo "✓ Alert manager built successfully"
        ls -lh build/libs/

    - name: Run alert-manager tests
      run: |
        echo "🧪 Running alert-manager tests..."
        cd alert-manager
        ./gradlew test
        echo "✓ All tests passed"

    - name: Build backup-manager module
      run: |
        echo "💾 Building backup-manager module..."
        cd backup-manager
        ./gradlew build
        echo "✓ Backup manager built successfully"
        ls -lh build/libs/

    - name: Run backup-manager tests
      run: |
        echo "🧪 Running backup-manager tests..."
        cd backup-manager
        ./gradlew test
        echo "✓ All tests passed"

    - name: Validate documentation
      run: |
        echo "📚 Validating documentation..."
        test -f README.md
        grep -q "# Open Minecraft Server Infrastructure" README.md  
        test -f LICENSE

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: 'v3.17.0'

    - name: Lint Helm chart
      run: |
        echo "⎈ Linting Helm chart..."
        helm lint helm/omcsi --set secrets.rconPassword=ci --set secrets.adminPassword=ci
        echo "✓ Helm chart linted successfully"

  helm-unit-test:
    name: Helm Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        # helm-unittest v1.x uses `platformHooks` in plugin.yaml, which requires
        # Helm v3.18+. The lint/smoke-test jobs pin v3.17 for stability; this
        # job needs a newer version so the plugin installs without error.
        version: 'v3.20.0'

    - name: Install helm-unittest plugin
      run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.1.0

    - name: Run Helm unit tests
      run: |
        echo "⎈ Running Helm unit tests..."
        helm unittest helm/omcsi
        echo "✓ All Helm unit tests passed"

  helm-deploy-test:
    name: Helm Deploy Smoke Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: 'v3.17.0'

    - name: Create kind cluster
      uses: helm/kind-action@99576bfa6ddf9a8e612d83b513da5a75875caced # v1.9.0
      with:
        cluster_name: omcsi-ci

    - name: Install Helm chart
      run: |
        echo "⎈ Installing OMCSI Helm chart into kind cluster..."
        # --wait=false because the container images are not built/loaded into the
        # kind cluster.  The test validates the chart produces valid Kubernetes
        # API objects (Deployments, Services, PVCs, etc.) beyond what
        # `helm lint` checks, not that the applications start.  Using --wait
        # would require building all images and loading them into kind, which is
        # out of scope for this smoke test.
        helm install omcsi ./helm/omcsi \
          --set secrets.rconPassword=ci-test-rcon \
          --set secrets.adminPassword=ci-test-admin \
          --wait=false \
          --timeout 60s
        echo "✓ Helm install completed"

    - name: Verify Deployments
      run: |
        echo "🔍 Verifying Deployments..."
        for dep in minecraft-wrapper webapp nginx backup-manager alert-manager; do
          kubectl get deployment "omcsi-${dep}" -o name
          echo "  ✓ Deployment omcsi-${dep} exists"
        done

    - name: Verify Services
      run: |
        echo "🔍 Verifying Services..."
        for svc in minecraft-wrapper minecraft-wrapper-internal webapp nginx backup-manager alert-manager; do
          kubectl get service "omcsi-${svc}" -o name
          echo "  ✓ Service omcsi-${svc} exists"
        done

    - name: Verify PVCs
      run: |
        echo "🔍 Verifying PersistentVolumeClaims..."
        for pvc in mcserver webapp-data alert-manager-data backups; do
          kubectl get pvc "omcsi-${pvc}" -o name
          echo "  ✓ PVC omcsi-${pvc} exists"
        done

    - name: Verify Secret and ConfigMap
      run: |
        echo "🔍 Verifying Secret..."
        kubectl get secret omcsi-secrets -o name
        echo "  ✓ Secret omcsi-secrets exists"

        echo "🔍 Verifying ConfigMap..."
        kubectl get configmap omcsi-nginx-config -o name
        echo "  ✓ ConfigMap omcsi-nginx-config exists"

    - name: Verify PodDisruptionBudgets
      run: |
        echo "🔍 Verifying PodDisruptionBudgets..."
        for pdb in minecraft-wrapper webapp alert-manager; do
          kubectl get pdb "omcsi-${pdb}" -o name
          echo "  ✓ PDB omcsi-${pdb} exists"
        done

    - name: Verify health probes and webapp init container
      run: |
        echo "🔍 Verifying startup probe on minecraft-wrapper..."
        STARTUP_PATH=$(kubectl get deployment omcsi-minecraft-wrapper \
          -o jsonpath='{.spec.template.spec.containers[0].startupProbe.httpGet.path}')
        [ "${STARTUP_PATH}" = "/actuator/health" ] || \
          { echo "FAIL: startupProbe path '${STARTUP_PATH}' != /actuator/health"; exit 1; }
        STARTUP_FT=$(kubectl get deployment omcsi-minecraft-wrapper \
          -o jsonpath='{.spec.template.spec.containers[0].startupProbe.failureThreshold}')
        [ "${STARTUP_FT}" = "60" ] || \
          { echo "FAIL: startupProbe failureThreshold '${STARTUP_FT}' != 60"; exit 1; }
        echo "  ✓ minecraft-wrapper startup probe (failureThreshold=60)"

        echo "🔍 Verifying liveness probe on backup-manager..."
        BM_LIVE=$(kubectl get deployment omcsi-backup-manager \
          -o jsonpath='{.spec.template.spec.containers[0].livenessProbe.httpGet.path}')
        [ "${BM_LIVE}" = "/actuator/health" ] || \
          { echo "FAIL: backup-manager livenessProbe path '${BM_LIVE}' != /actuator/health"; exit 1; }
        echo "  ✓ backup-manager liveness probe"

        echo "🔍 Verifying wait-for-wrapper init container on webapp..."
        INIT_NAME=$(kubectl get deployment omcsi-webapp \
          -o jsonpath='{.spec.template.spec.initContainers[0].name}')
        [ "${INIT_NAME}" = "wait-for-wrapper" ] || \
          { echo "FAIL: webapp init container '${INIT_NAME}' != wait-for-wrapper"; exit 1; }
        echo "  ✓ webapp wait-for-wrapper init container"

    - name: Verify Service types and ports
      run: |
        echo "🔍 Verifying Service specs..."

        # Minecraft external service should be NodePort
        MC_TYPE=$(kubectl get svc omcsi-minecraft-wrapper -o jsonpath='{.spec.type}')
        echo "  minecraft-wrapper type: ${MC_TYPE}"
        [ "${MC_TYPE}" = "NodePort" ] || { echo "FAIL: expected NodePort"; exit 1; }

        # Internal service should be ClusterIP
        INT_TYPE=$(kubectl get svc omcsi-minecraft-wrapper-internal -o jsonpath='{.spec.type}')
        echo "  minecraft-wrapper-internal type: ${INT_TYPE}"
        [ "${INT_TYPE}" = "ClusterIP" ] || { echo "FAIL: expected ClusterIP"; exit 1; }

        # Internal service should expose RCON port
        RCON_PORT=$(kubectl get svc omcsi-minecraft-wrapper-internal -o jsonpath='{.spec.ports[?(@.name=="rcon")].port}')
        echo "  RCON port: ${RCON_PORT}"
        [ "${RCON_PORT}" = "25575" ] || { echo "FAIL: expected RCON port 25575"; exit 1; }

        # Nginx service should be LoadBalancer
        NGINX_TYPE=$(kubectl get svc omcsi-nginx -o jsonpath='{.spec.type}')
        echo "  nginx type: ${NGINX_TYPE}"
        [ "${NGINX_TYPE}" = "LoadBalancer" ] || { echo "FAIL: expected LoadBalancer"; exit 1; }

        echo "  ✓ All Service specs verified"

    - name: Verify Helm release status
      run: |
        echo "⎈ Checking Helm release status..."
        helm list
        STATUS=$(helm status omcsi -o json | jq -r '.info.status')
        echo "  Release status: ${STATUS}"
        [ "${STATUS}" = "deployed" ] || { echo "FAIL: expected status 'deployed'"; exit 1; }
        echo "  ✓ Helm release is in 'deployed' state"

    - name: Cleanup
      if: always()
      run: |
        helm uninstall omcsi --ignore-not-found || true

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: '1.9.0'

    - name: Terraform fmt check (Linode)
      run: |
        echo "🔍 Checking Terraform formatting (Linode)..."
        terraform -chdir=terraform/linode fmt -check -diff
        echo "✓ Linode Terraform files are properly formatted"

    - name: Terraform fmt check (AWS)
      run: |
        echo "🔍 Checking Terraform formatting (AWS)..."
        terraform -chdir=terraform/aws fmt -check -diff
        echo "✓ AWS Terraform files are properly formatted"

    - name: Terraform init (Linode)
      run: |
        echo "⚙️ Initializing Terraform (Linode)..."
        terraform -chdir=terraform/linode init -backend=false
        echo "✓ Linode Terraform initialized"

    - name: Terraform validate (Linode)
      run: |
        echo "✅ Validating Terraform configuration (Linode)..."
        terraform -chdir=terraform/linode validate
        echo "✓ Linode Terraform configuration is valid"

    - name: Terraform init (AWS)
      run: |
        echo "⚙️ Initializing Terraform (AWS)..."
        terraform -chdir=terraform/aws init -backend=false
        echo "✓ AWS Terraform initialized"

    - name: Terraform validate (AWS)
      run: |
        echo "✅ Validating Terraform configuration (AWS)..."
        terraform -chdir=terraform/aws validate
        echo "✓ AWS Terraform configuration is valid"

    - name: Terraform fmt check (Existing Cluster)
      run: |
        echo "🔍 Checking Terraform formatting (Existing Cluster)..."
        terraform -chdir=terraform/existing-cluster fmt -check -diff
        echo "✓ Existing Cluster Terraform files are properly formatted"

    - name: Terraform init (Existing Cluster)
      run: |
        echo "⚙️ Initializing Terraform (Existing Cluster)..."
        terraform -chdir=terraform/existing-cluster init -backend=false
        echo "✓ Existing Cluster Terraform initialized"

    - name: Terraform validate (Existing Cluster)
      run: |
        echo "✅ Validating Terraform configuration (Existing Cluster)..."
        terraform -chdir=terraform/existing-cluster validate
        echo "✓ Existing Cluster Terraform configuration is valid"

    - name: Terraform fmt check (Hetzner)
      run: |
        echo "🔍 Checking Terraform formatting (Hetzner)..."
        terraform -chdir=terraform/hetzner fmt -check -diff
        echo "✓ Hetzner Terraform files are properly formatted"

    - name: Terraform init (Hetzner)
      run: |
        echo "⚙️ Initializing Terraform (Hetzner)..."
        terraform -chdir=terraform/hetzner init -backend=false
        echo "✓ Hetzner Terraform initialized"

    - name: Terraform validate (Hetzner)
      run: |
        echo "✅ Validating Terraform configuration (Hetzner)..."
        terraform -chdir=terraform/hetzner validate
        echo "✓ Hetzner Terraform configuration is valid"

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.35.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: true
        
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

  nginx-config-test:
    name: nginx Configuration Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Builds the nginx image and asserts the configuration nginx actually
    # resolves (`nginx -T`, includes and all). No other job builds or runs the
    # nginx image, so without this a broken include, a fragment that fails to
    # render, or a route that survives being disabled would pass CI unnoticed.
    # The Kubernetes side of the same routes is covered by
    # helm/omcsi/tests/nginx_test.yaml in the Helm Unit Tests job.
    - name: Test nginx BlueMap route
      run: |
        echo "🔀 Testing nginx route configuration..."
        ./scripts/test-nginx-bluemap-route.sh
        echo "✓ nginx route configuration verified"

  jar-replacement-test:
    name: Server JAR Replacement Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Exercises setup_server() directly against a fixture directory. The
    # behaviour being protected is that an existing server JAR is never removed
    # until a verified replacement is staged: a MINECRAFT_VERSION ahead of its
    # image tag previously deleted the running JAR and then failed to copy the
    # replacement, leaving a world with nothing to run it. Nothing else in CI
    # covers this path, because every other job starts from an empty server
    # directory and so never reaches the upgrade branch.
    - name: Test server JAR replacement
      run: |
        echo "📦 Testing server JAR replacement..."
        ./scripts/test-jar-replacement.sh
        echo "✓ server JAR replacement verified"

  python-client-test:
    name: Python Client Tests
    runs-on: ubuntu-latest

    # The matrix is the floor and the ceiling of what clients/python/pyproject.toml
    # claims to support. Anything in between is interpolation; the two ends are
    # where a stdlib behaviour change actually breaks the client.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # Installed rather than run off the source tree, so a broken pyproject.toml
    # or a package that does not actually ship its modules fails here instead of
    # at release time.
    - name: Install the client
      run: |
        echo "🐍 Installing omcsi-client..."
        python -m pip install --upgrade pip
        python -m pip install -e ./clients/python
        python -c "import omcsi_client; print('omcsi-client', omcsi_client.__version__)"

    - name: Run Python client tests
      working-directory: clients/python
      run: |
        echo "🧪 Running Python client tests..."
        python -m unittest discover -s tests -t tests -v
        echo "✓ All tests passed"

    - name: Verify the client has no runtime dependencies
      run: |
        echo "📦 Checking omcsi-client declares no runtime dependencies..."
        # The package's selling point is that it installs anywhere Python does.
        # A dependency added by accident would go unnoticed otherwise, because
        # CI installs into a fresh environment where anything resolves.
        deps=$(python -c "
        from importlib.metadata import requires
        print('\n'.join(requires('omcsi-client') or []))
        ")
        if [ -n "${deps}" ]; then
          echo "FAIL: omcsi-client declares runtime dependencies:"
          echo "${deps}"
          exit 1
        fi
        echo "✓ No runtime dependencies"
