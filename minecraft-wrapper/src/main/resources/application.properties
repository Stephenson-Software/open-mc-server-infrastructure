server.port=8092
spring.application.name=minecraft-wrapper

# Minecraft server configuration
minecraft.server.jar=${MINECRAFT_SERVER_JAR:/mcserver/spigot-26.2.jar}
minecraft.server.directory=${MINECRAFT_SERVER_DIRECTORY:/mcserver}
minecraft.java.opts=${JAVA_OPTS:--Xmx2G -Xms1G}
minecraft.auto.start=${MINECRAFT_AUTO_START:true}
minecraft.auto.restart=${MINECRAFT_AUTO_RESTART:false}

# Alert manager configuration
alert.manager.url=${ALERT_MANAGER_URL:http://alert-manager:8090/api/alerts}
alerts.server.start=${ALERTS_SERVER_START:true}
alerts.server.stop=${ALERTS_SERVER_STOP:true}
alerts.server.crash=${ALERTS_SERVER_CRASH:true}
alerts.plugin.deploy=${ALERTS_PLUGIN_DEPLOY:true}
alerts.world.upload=${ALERTS_WORLD_UPLOAD:true}

# Plugin deployment
# Token required in the Authorization: Bearer <token> header to use POST /api/plugins/deploy
# and POST /api/world/upload. Leave empty (default) to disable both endpoints entirely.
deploy.auth.token=${DEPLOY_AUTH_TOKEN:}
plugins.directory=${PLUGINS_DIRECTORY:/mcserver/plugins}
world.directory=${WORLD_DIRECTORY:/mcserver/world}

# Web app integration
webapp.url=${WEBAPP_URL:}
deployment.auth.token=${DEPLOYMENT_AUTH_TOKEN:}
# Multipart limits for plugin JARs and world ZIPs. Raise these together with the
# web app's MAX_FILE_UPLOAD_SIZE / MAX_REQUEST_UPLOAD_SIZE and nginx's
# client_max_body_size — a request is rejected by whichever limit it meets first.
spring.servlet.multipart.max-file-size=${MAX_FILE_UPLOAD_SIZE:2048MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_UPLOAD_SIZE:2048MB}

# Where Spring buffers an in-flight multipart upload before the handler runs.
# Empty uses the servlet container's temp directory, which lives on the
# container's writable layer — fine at the default limits, but a multi-GB world
# archive can exhaust a pod's ephemeral storage there. Point it at a path on the
# mcserver volume (e.g. /mcserver/tmp) when raising the limits substantially.
spring.servlet.multipart.location=${MULTIPART_TEMP_DIR:}

# World upload limits, all applied by WorldUploadService after the multipart
# limits above have been satisfied.
world.upload.max-file-size-mb=${WORLD_UPLOAD_MAX_FILE_SIZE_MB:2048}
world.upload.max-extracted-mb=${WORLD_UPLOAD_MAX_EXTRACTED_MB:10240}
world.upload.max-entries=${WORLD_UPLOAD_MAX_ENTRIES:100000}

# Diagnostic log access (disabled by default for security)
logs.diagnostic.enabled=${LOGS_DIAGNOSTIC_ENABLED:false}
logs.diagnostic.max-lines=${LOGS_DIAGNOSTIC_MAX_LINES:100}

# Usage reporting (https://github.com/Stephenson-Software/trace). Once the wrapper is up it
# sends a single "startup" event carrying the program name (open-mc-server-infrastructure),
# the wrapper's version and any tags below — nothing per request or per player, and nothing
# about the world, the operator, the host or its address. The send runs on its own daemon
# thread, never throws and never blocks startup. On by default; USAGE_REPORTING_ENABLED=false
# turns it off. The key is the project's write-only program key, not a secret.
usage-reporting.enabled=${USAGE_REPORTING_ENABLED:true}
usage-reporting.endpoint=${USAGE_REPORTING_ENDPOINT:https://trace.danielstephenson.dev}
usage-reporting.key=${USAGE_REPORTING_KEY:9Q2Q3NTQCZbqdMhF-8-rrMOm_N4e47JqT0VnRt2t6_A}
# Comma-separated k=v pairs attached to every event, e.g. ci=true so a CI deployment can be
# told apart from a real one. "version" is reserved for the wrapper's own version.
usage-reporting.tags=${USAGE_REPORTING_TAGS:}

# Actuator configuration
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always

# Logging
logging.level.com.openmc.minecraftwrapper=INFO
