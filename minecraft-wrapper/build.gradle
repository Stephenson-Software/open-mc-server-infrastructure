plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.openmc'
version = '0.1.0-SNAPSHOT-8-8-2026'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.19'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// Bakes the version above into META-INF/build-info.properties so the wrapper can report
// it at runtime (Spring Boot's BuildProperties); nothing else reads the file.
springBoot {
    buildInfo()
}

tasks.named('test') {
    useJUnitPlatform()
    // Never report a test run to the trace service (see usage-reporting.* in
    // application.properties); the stub-backed tests set their own endpoint explicitly.
    environment 'USAGE_REPORTING_ENABLED', 'false'
}
